<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#14100D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#14100D;
    --raised:#1D1813;
    --lit:#261F18;
    --hair:#332A21;
    --hair-bright:#473B2E;

    --ink:#F0E9DE;
    --ink-soft:#9C9183;
    --ink-dim:#6B6054;

    --lamp:#E3A648;
    --lamp-deep:#A8762B;

    --done:#62A86B;
    --miss:#CE4B3C;
    --sick:#B06A4A;

    --mood-terrible:#7A3B4A;
    --mood-okay:#6B6054;
    --mood-alright:#5B7E8C;
    --mood-good:#6E9E6A;
    --mood-happy:#E3A648;

    --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
    --serif:'Newsreader',Georgia,serif;

    --tab-h:62px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;height:100%;background:var(--ground);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  input,textarea,select{
    font-family:var(--sans);font-size:16px;color:var(--ink);
    background:var(--ground);border:1px solid var(--hair);
    border-radius:8px;padding:11px 13px;outline:none;width:100%;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--hair-bright)}
  input::placeholder,textarea::placeholder{color:var(--ink-dim)}
  textarea{resize:none}
  :focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .fig{font-variant-numeric:tabular-nums}

  /* ── shell ─────────────────────────────── */
  #shell{display:flex;flex-direction:column;height:100dvh}
  header{flex:none;display:flex;align-items:flex-start;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px}
  .head-date{flex:1;min-width:0}
  .head-date .dow,.head-date .md{
    font-family:var(--serif);font-size:27px;line-height:1.1;
    font-weight:400;letter-spacing:-.01em;display:block;
  }
  .head-date .md{color:var(--ink-dim)}
  .head-date .ctx{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .head-tools{flex:none;display:flex;align-items:center;gap:4px;padding-top:4px;position:relative}

  .sync{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);display:block}
  .sync.ok i{background:var(--done)}
  .sync.busy i{background:var(--lamp);animation:breathe 1.4s ease-in-out infinite}
  .sync.bad i{background:var(--miss)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.25}}

  .dots{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft)}
  .dots:active{background:var(--raised)}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(26px + var(--tab-h) + env(safe-area-inset-bottom))}

  /* ── tabs ──────────────────────────────── */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(5,1fr);
    background:rgba(20,16,13,.93);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-dim);position:relative}
  nav button span{font-size:10.5px;font-weight:500}
  nav button svg{width:21px;height:21px;stroke-width:1.6}
  nav button[aria-current=true]{color:var(--lamp)}
  nav button[aria-current=true]::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:26px;height:2px;background:var(--lamp);border-radius:0 0 2px 2px;box-shadow:0 0 14px 1px var(--lamp);
  }
  nav .badge{
    position:absolute;top:9px;left:calc(50% + 8px);min-width:15px;height:15px;padding:0 4px;
    border-radius:8px;background:var(--miss);color:#fff;font-size:9.5px;font-weight:600;
    display:grid;place-items:center;line-height:1;
  }

  /* ── warning band ──────────────────────── */
  .warn{
    display:flex;align-items:center;gap:11px;
    background:linear-gradient(90deg,rgba(206,75,60,.17),rgba(206,75,60,.04));
    border-left:3px solid var(--miss);border-radius:3px 9px 9px 3px;
    padding:13px 15px;margin-bottom:16px;
  }
  .warn svg{width:19px;height:19px;flex:none;color:var(--miss)}
  .warn b{color:var(--miss);font-weight:600}
  .warn p{margin:0;font-size:13.5px;line-height:1.4}

  /* ── buttons ───────────────────────────── */
  .btn{
    min-height:42px;padding:0 17px;border-radius:9px;background:var(--lit);
    border:1px solid var(--hair);font-size:14px;font-weight:500;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{background:var(--hair)}
  .btn-lamp{background:var(--lamp);border-color:var(--lamp);color:#1C1409;font-weight:600}
  .btn-lamp:active{background:var(--lamp-deep)}
  .btn-quiet{background:none;border-color:transparent;color:var(--ink-soft)}
  .btn-quiet:active{background:var(--raised)}
  .btn-sm{min-height:36px;padding:0 13px;font-size:13px}
  .btn-danger{background:var(--miss);border-color:var(--miss);color:#fff;font-weight:600}
  .icon-btn{
    width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:9px;
    background:var(--raised);border:1px solid var(--hair);color:var(--ink-soft);
  }
  .icon-btn:active{background:var(--lit)}
  .icon-btn svg{width:19px;height:19px;stroke-width:1.7}

  /* ── habits toolbar ────────────────────── */
  .h-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .h-bar .ttl{flex:1;font-family:var(--serif);font-size:19px;font-weight:400}
  .h-bar .ttl small{font-family:var(--sans);font-size:12px;color:var(--ink-dim);margin-left:8px}

  /* ── habit card ────────────────────────── */
  .habit{
    position:relative;display:flex;align-items:center;gap:10px;
    background:var(--raised);border:1px solid var(--hair);border-radius:13px;
    padding:13px 10px 13px 6px;margin-bottom:8px;min-height:62px;overflow:hidden;
  }
  .habit > *{position:relative;z-index:1}
  .grip{
    flex:none;width:26px;align-self:stretch;display:grid;place-items:center;
    color:var(--ink-dim);touch-action:none;cursor:grab;border-radius:7px;
  }
  .grip svg{width:15px;height:15px}
  .grip:active{cursor:grabbing;background:var(--hair);color:var(--ink-soft)}
  .tap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
  .tick{
    flex:none;width:30px;height:30px;border-radius:9px;
    border:1.8px solid #615241;background:rgba(0,0,0,.25);
    display:grid;place-items:center;color:transparent;transition:transform .12s ease;
  }
  .tap:active .tick{transform:scale(.88)}
  .tick svg{width:17px;height:17px;stroke-width:2.6}
  .habit .body{flex:1;min-width:0;display:block}
  .habit .nm{display:block;font-size:15.5px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .habit .sub{display:block;font-size:12px;color:var(--ink-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .habit.pre .nm{color:var(--ink-soft)}

  .habit.done{
    border-color:rgba(98,168,107,.5);
    background:linear-gradient(135deg,rgba(98,168,107,.15),rgba(98,168,107,.05));
    box-shadow:0 0 22px -10px rgba(98,168,107,.55);
  }
  .habit.done .tick{background:var(--done);border-color:var(--done);color:#122116}
  .habit.done .nm{color:#9BD3A1}
  .habit.miss{border-color:rgba(206,75,60,.5)}
  .habit.miss::after{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,rgba(206,75,60,.2),rgba(206,75,60,.07))}
  .habit.miss .nm{color:#ECA79C}
  .habit.miss .tick{border-color:rgba(206,75,60,.7)}
  .miss-tag{
    flex:none;display:flex;align-items:center;gap:5px;background:rgba(206,75,60,.2);
    border:1px solid rgba(206,75,60,.42);color:#ECA79C;font-size:11.5px;font-weight:600;
    padding:4px 9px;border-radius:7px;
  }
  .miss-tag svg{width:12px;height:12px;stroke-width:2.2}
  .kebab{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink-dim)}
  .kebab:active{background:var(--hair)}
  .kebab svg{width:17px;height:17px}

  /* dragging */
  .dragging{
    opacity:.96;box-shadow:0 14px 34px -8px rgba(0,0,0,.85);
    transform:scale(1.02);z-index:30;position:relative;
    border-color:var(--lamp)!important;
  }
  .drag-on{user-select:none;-webkit-user-select:none}
  .droplist{min-height:8px}
  .droplist.over{background:rgba(227,166,72,.05);border-radius:11px}

  /* ── groups ────────────────────────────── */
  .group{border:1px solid var(--hair);border-radius:14px;margin-bottom:10px;background:rgba(0,0,0,.14);overflow:hidden}
  .g-head{display:flex;align-items:center;gap:8px;padding:11px 10px 11px 6px}
  .g-open{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left}
  .g-chev{flex:none;width:20px;height:20px;display:grid;place-items:center;color:var(--ink-soft);transition:transform .18s ease}
  .g-chev svg{width:15px;height:15px;stroke-width:2.2}
  .group.open .g-chev{transform:rotate(90deg)}
  .g-nm{flex:1;min-width:0;font-family:var(--serif);font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-count{flex:none;font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .g-count.all{color:var(--done)}
  .g-count.bad{color:var(--miss)}
  .g-body{padding:0 8px 8px}
  .group:not(.open) .g-body{display:none}
  .g-empty{padding:14px 10px;color:var(--ink-dim);font-size:13px;text-align:center}

  /* ── tally ─────────────────────────────── */
  .tally{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
  .tally div{display:flex;flex-direction:column;gap:2px}
  .tally .n{font-family:var(--serif);font-size:25px;line-height:1;font-weight:400}
  .tally .l{font-size:11.5px;color:var(--ink-soft)}
  .tally .red .n{color:var(--miss)}
  .tally .grn .n{color:var(--done)}

  .empty{padding:44px 12px;text-align:center}
  .empty h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 7px}
  .empty p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.5}

  /* ── event / notes ─────────────────────── */
  .note{
    font-family:var(--serif);font-size:17.5px;line-height:1.68;background:var(--raised);
    border:1px solid var(--hair);border-radius:13px;padding:19px;min-height:48vh;
  }
  .note[readonly]{color:var(--ink-soft);background:var(--ground)}
  .note-foot{display:flex;justify-content:space-between;margin-top:11px;font-size:12px;color:var(--ink-dim)}

  /* ── health ────────────────────────────── */
  .sect{margin-bottom:30px}
  .sect > h2{font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 13px}
  .moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .mood{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 2px 11px;border-radius:12px;background:var(--raised);border:1.5px solid var(--hair)}
  .mood em{font-size:25px;line-height:1;font-style:normal}
  .mood span{font-size:10px;color:var(--ink-dim);font-weight:500}
  .mood.on{background:var(--lit)}
  .mood.on span{color:var(--ink)}
  .mood[data-m=terrible].on{border-color:var(--mood-terrible);box-shadow:0 0 20px -7px var(--mood-terrible)}
  .mood[data-m=okay].on{border-color:#9A8C79;box-shadow:0 0 20px -7px #9A8C79}
  .mood[data-m=alright].on{border-color:var(--mood-alright);box-shadow:0 0 20px -7px var(--mood-alright)}
  .mood[data-m=good].on{border-color:var(--mood-good);box-shadow:0 0 20px -7px var(--mood-good)}
  .mood[data-m=happy].on{border-color:var(--mood-happy);box-shadow:0 0 20px -7px var(--mood-happy)}
  .mood-note{font-family:var(--serif);font-size:16px;line-height:1.6;min-height:74px;margin-top:11px;background:var(--raised)}
  .mood-note[readonly]{color:var(--ink-soft);background:var(--ground)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .seg button{min-height:48px;border-radius:11px;font-size:14.5px;font-weight:600;background:var(--raised);border:1.5px solid var(--hair);color:var(--ink-soft)}
  .seg button.on-fine{background:rgba(98,168,107,.16);border-color:var(--done);color:#9BD3A1}
  .seg button.on-sick{background:rgba(176,106,74,.18);border-color:var(--sick);color:#E0A683}
  .seg button .carry{display:block;font-size:10.5px;font-weight:400;color:var(--ink-dim);margin-top:2px}
  .sickbox{margin-top:14px;background:var(--raised);border:1px solid var(--hair);border-radius:13px;padding:17px}
  .sickbox > h3{font-family:var(--serif);font-size:15.5px;font-weight:400;margin:0 0 11px;color:var(--ink-soft)}
  .sickbox > h3:not(:first-child){margin-top:19px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .chip-wrap{display:inline-flex;align-items:center;position:relative}
  .chip{padding:9px 14px;border-radius:999px;font-size:13px;background:var(--ground);border:1px solid var(--hair);min-height:38px;display:inline-flex;align-items:center}
  .chip.on{background:var(--sick);border-color:var(--sick);color:#20120B;font-weight:600}
  .chip.has-x{padding-right:33px}
  .chip-x{position:absolute;right:0;top:0;bottom:0;width:30px;display:grid;place-items:center;font-size:17px;line-height:1;color:var(--ink-dim);border-radius:0 999px 999px 0}
  .chip.on + .chip-x{color:#3A2014}
  .chip-add{border-style:dashed;color:var(--ink-soft)}
  .ill-add{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .ill-add input{flex:1;min-width:150px}
  .ill-add .btn{flex:none}
  .sick-note{font-family:var(--serif);font-size:16px;line-height:1.6;min-height:92px}
  .day-of{margin-top:13px;font-size:12.5px;color:var(--sick);display:flex;align-items:center;gap:8px;line-height:1.45}
  .day-of svg{width:15px;height:15px;flex:none}

  /* ── calendar ──────────────────────────── */
  .cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
  .cal-bar h2{font-family:var(--serif);font-size:22px;font-weight:400;margin:0}
  .cal-bar h2 i{font-style:normal;color:var(--ink-dim)}
  .stepper{display:flex;align-items:center;gap:2px}
  .stepper button{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--ink-soft)}
  .stepper button:active{background:var(--raised)}
  .stepper svg{width:18px;height:18px}
  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .dow-row span{text-align:center;font-size:10.5px;color:var(--ink-dim);font-weight:500;padding:3px 0}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{
    aspect-ratio:.82;background:var(--raised);border:1px solid var(--hair);border-radius:9px;
    padding:5px 4px 4px;position:relative;overflow:hidden;
    display:grid;grid-template-rows:auto 17px 10px 1fr;justify-items:center;
  }
  .cell .d{font-family:var(--serif);font-size:14px;line-height:1;font-variant-numeric:tabular-nums;justify-self:start;padding-left:2px}
  .cell .em{font-size:15px;line-height:17px;height:17px}
  .cell .hz{font-size:7.5px;font-weight:600;letter-spacing:.04em;line-height:10px;height:10px}
  .cell .hz.s{color:var(--sick)}
  .cell .hz.f{color:var(--done);opacity:.5}
  .cell .pips{display:flex;gap:2.5px;align-self:end;padding-bottom:1px;flex-wrap:wrap;justify-content:center}
  .cell .pips i{width:4px;height:4px;border-radius:50%;background:var(--hair-bright);display:block}
  .cell .pips i.d{background:var(--done)}
  .cell .pips i.m{background:var(--miss)}
  .cell .nt{position:absolute;top:5px;right:5px;width:4px;height:4px;border-radius:50%;background:var(--mood-alright)}
  .cell.out{opacity:.25}
  .cell.now{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp) inset,0 0 26px -9px var(--lamp)}
  .cell.now .d{color:var(--lamp)}

  /* ── heatmap ───────────────────────────── */
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px}
  .heat{display:flex;gap:3px;min-width:max-content}
  .heat .wk{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
  .hcell{width:13px;height:13px;border-radius:3px;background:var(--raised);display:block;border:none;padding:0}
  .hcell[data-m=terrible]{background:var(--mood-terrible)}
  .hcell[data-m=okay]{background:var(--mood-okay)}
  .hcell[data-m=alright]{background:var(--mood-alright)}
  .hcell[data-m=good]{background:var(--mood-good)}
  .hcell[data-m=happy]{background:var(--mood-happy)}
  .hcell.sk{box-shadow:0 0 0 1.5px var(--sick) inset}
  .hcell.gh{opacity:.1}
  .hcell.tdy{box-shadow:0 0 0 2px var(--lamp)}
  .mon-row{display:flex;gap:3px;min-width:max-content;margin-bottom:7px}
  .mon-row span{width:13px;font-size:10px;color:var(--ink-dim);white-space:nowrap;overflow:visible}

  /* phone heatmap: twelve small months, so the year fits in a glance */
  .heat-v{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
  .mini-h{font-family:var(--serif);font-size:14px;color:var(--ink-soft);margin-bottom:7px}
  .mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2.5px}
  .mini-g .hcell{width:100%;height:auto;aspect-ratio:1;border-radius:3.5px}
  .mini-g .blank{aspect-ratio:1}
  .key{display:flex;flex-wrap:wrap;gap:13px;margin-top:18px;font-size:11.5px;color:var(--ink-soft)}
  .key div{display:flex;align-items:center;gap:6px}
  .key i{width:11px;height:11px;border-radius:3px;display:block}

  /* ── stats ─────────────────────────────── */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:24px}
  .stat{background:var(--raised);border:1px solid var(--hair);border-radius:12px;padding:15px}
  .stat .l{font-size:11.5px;color:var(--ink-soft);margin-bottom:7px}
  .stat .v{font-family:var(--serif);font-size:28px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:14px;color:var(--ink-dim)}
  .stat .s{font-size:11.5px;color:var(--ink-dim);margin-top:5px}
  .mbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--ground);margin-top:11px}
  .hrow{display:grid;grid-template-columns:1fr auto;gap:10px 13px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}
  .hrow:first-of-type{border-top:none}
  .hrow .nm{font-size:14px;font-weight:500}
  .hrow .fq{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
  .hrow .pct{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
  .hrow .track{grid-column:1/-1;height:5px;border-radius:3px;background:var(--ground);overflow:hidden}
  .hrow .track i{display:block;height:100%;background:var(--done);border-radius:3px}
  .toggle2{display:inline-flex;background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:3px;margin-bottom:18px}
  .toggle2 button{min-height:34px;padding:0 15px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-soft)}
  .toggle2 button.on{background:var(--lit);color:var(--ink)}

  /* ── day summary ───────────────────────── */
  .sum-sect{margin-bottom:26px}
  .sum-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--hair)}
  .sum-h h3{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
  .sum-h .meta{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .sum-line{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14.5px}
  .sum-line .mk{flex:none;width:17px;text-align:center;line-height:1.5}
  .sum-line .mk.y{color:var(--done)}
  .sum-line .mk.n{color:var(--miss)}
  .sum-line .mk.q{color:var(--ink-dim)}
  .sum-line .tx{flex:1;min-width:0}
  .sum-line .tx.off{color:var(--ink-soft)}
  .sum-line .rt{flex:none;font-size:11.5px;color:var(--miss);font-weight:600}
  .sum-grp{font-size:11.5px;color:var(--ink-dim);margin:14px 0 4px;letter-spacing:.02em}
  .sum-mood{display:flex;align-items:center;gap:12px;font-size:16px}
  .sum-mood em{font-size:30px;line-height:1;font-style:normal}
  .sum-quote{
    font-family:var(--serif);font-size:16.5px;line-height:1.65;color:var(--ink);
    margin-top:11px;padding-left:13px;border-left:2px solid var(--hair-bright);white-space:pre-wrap;
  }
  .sum-none{color:var(--ink-dim);font-size:13.5px;font-style:italic}
  .sum-tag{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600}
  .sum-tag.sick{color:var(--sick)}
  .sum-tag.fine{color:var(--done)}
  .sum-actions{display:flex;gap:9px;margin-top:24px}
  .sum-actions .btn{flex:1}

  /* ── sheets & dialogs ──────────────────── */
  .scrim{
    position:fixed;inset:0;z-index:60;background:rgba(10,7,5,.72);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    display:none;align-items:flex-end;justify-content:center;
  }
  .scrim.show{display:flex}
  .scrim.mid{align-items:center}
  .sheet{
    background:var(--ground);width:100%;max-width:620px;border-radius:20px 20px 0 0;
    border-top:1px solid var(--hair);max-height:92dvh;display:flex;flex-direction:column;
    animation:up .26s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet-top{flex:none;display:flex;align-items:flex-start;gap:12px;padding:20px 18px 14px;border-bottom:1px solid var(--hair)}
  .sheet-top .t{flex:1;min-width:0}
  .sheet-top .t b{font-family:var(--serif);font-size:23px;font-weight:400;display:block;line-height:1.1}
  .sheet-top .t i{font-style:normal;font-size:12.5px;color:var(--ink-soft);display:block;margin-top:4px}
  .sheet-body{flex:1;overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet-nav{display:flex;justify-content:space-between;gap:9px;margin-top:8px}
  .x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft);flex:none}
  .x:active{background:var(--raised)}

  .edit-bar{
    position:sticky;top:-20px;z-index:5;margin:-20px -18px 18px;padding:13px 18px;
    background:rgba(38,31,24,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--lamp-deep);display:flex;align-items:center;gap:10px;
  }
  .edit-bar .lb{flex:1;font-size:13px;color:var(--lamp);min-width:0}
  .edit-bar .btn{flex:none}

  .ask{background:var(--ground);border:1px solid var(--hair-bright);border-radius:17px;width:100%;max-width:370px;padding:24px;margin:auto 16px;animation:pop .2s cubic-bezier(.2,.9,.25,1)}
  @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  .ask h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 9px;line-height:1.25}
  .ask p{margin:0 0 22px;color:var(--ink-soft);font-size:14px;line-height:1.5}
  .ask .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ask .row .btn{min-height:46px}
  .ask input,.ask select{margin-bottom:16px}
  .ask label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:7px}

  .menu{
    position:absolute;right:0;top:42px;z-index:50;min-width:218px;background:var(--raised);
    border:1px solid var(--hair-bright);border-radius:13px;padding:5px;display:none;
    box-shadow:0 18px 44px -12px rgba(0,0,0,.8);
  }
  .menu.show{display:block}
  .menu .who{padding:11px 12px 9px;font-size:11.5px;color:var(--ink-dim);word-break:break-all;line-height:1.4}
  .menu hr{border:none;border-top:1px solid var(--hair);margin:4px 0}
  .menu button{display:flex;width:100%;padding:11px 12px;border-radius:8px;font-size:14px;text-align:left;align-items:center;gap:10px;min-height:42px}
  .menu button:active{background:var(--lit)}
  .menu button svg{width:17px;height:17px;color:var(--ink-soft);flex:none}
  .menu button.bad{color:var(--miss)}
  .menu button.bad svg{color:var(--miss)}
  .pop-menu{position:fixed;z-index:70;min-width:216px;background:var(--raised);border:1px solid var(--hair-bright);border-radius:13px;padding:5px;box-shadow:0 18px 44px -12px rgba(0,0,0,.85)}
  .pop-menu button{display:flex;width:100%;padding:12px;border-radius:8px;font-size:14px;text-align:left;align-items:center;gap:10px;min-height:44px}
  .pop-menu button:active{background:var(--lit)}
  .pop-menu button svg{width:17px;height:17px;color:var(--ink-soft);flex:none}
  .pop-menu button.bad{color:var(--miss)}
  .pop-menu button.bad svg{color:var(--miss)}
  .pop-menu hr{border:none;border-top:1px solid var(--hair);margin:4px 0}

  .toasts{position:fixed;left:0;right:0;z-index:80;bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 18px}
  .toast{background:var(--lit);border:1px solid var(--hair-bright);border-radius:10px;padding:11px 16px;font-size:13.5px;box-shadow:0 12px 32px -10px rgba(0,0,0,.8);max-width:420px;animation:tin .22s ease}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .toast.bad{border-color:var(--miss);color:#ECA79C}
  .toast.good{border-color:var(--done)}

  @media (min-width:760px){
    :root{--tab-h:0px}
    #shell{max-width:860px;margin:0 auto}
    header{padding:28px 32px 18px;align-items:center}
    .head-date .dow,.head-date .md{font-size:34px;display:inline}
    .head-date .md{margin-left:9px}
    nav{position:static;display:flex;gap:3px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-top:none;border-bottom:1px solid var(--hair);padding:0 32px}
    nav button{height:46px;flex-direction:row;gap:8px;padding:0 15px;border-radius:0}
    nav button span{font-size:13.5px}
    nav button svg{width:17px;height:17px}
    nav button[aria-current=true]::before{top:auto;bottom:0;width:100%;border-radius:2px 2px 0 0}
    nav .badge{position:static;margin-left:2px}
    main{padding:24px 32px 60px}
    .scrim{align-items:center;padding:24px}
    .sheet{border-radius:18px;border:1px solid var(--hair)}
    .moods{grid-template-columns:repeat(5,minmax(0,110px));justify-content:start}
    .stats{grid-template-columns:repeat(4,1fr)}
    .cell{aspect-ratio:1.05}
    .cell .d{font-size:15px}
    .cell .em{font-size:18px}
  }
</style>
</head>
<body>

<div id="shell">
  <header>
    <div class="head-date" id="headDate"></div>
    <div class="head-tools">
      <div class="sync" id="sync"><i></i></div>

        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
      <div class="menu" id="menu">
        <div class="who" id="who">Not signed in</div>
        <hr>
        <button data-act="signin" id="signinBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          Sign in to Google</button>
        <button data-act="signout" id="signoutBtn" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
          Why can't I sign in?</button>
        <hr>
        <button data-act="syncnow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg>
          Sync now</button>
        <button data-act="export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export JSON</button>
        <button data-act="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          Import JSON</button>
      </div>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div class="scrim" id="daySheet"></div>
<div class="scrim mid" id="askBox"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
'use strict';

const CONFIG = {
  GOOGLE_CLIENT_ID: '985235699107-02f7jek8uvp57o5oissq94ms85ujphf8.apps.googleusercontent.com',
  FILE_NAME: 'diary-data.json',
  FOLDER_NAME: 'Diary',
  SCHEMA: 1,
  DEBOUNCE: 2500,
  POLL: 60000,
  SICK_NUDGE_AFTER: 7,
  NARROW: 760
};

/* ══ helpers ══════════════════════════════ */
const $ = s => document.querySelector(s);
const uid = () => 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function today(){ return key(new Date()); }
function shift(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function span(a,b){ return Math.round((fromKey(b)-fromKey(a))/86400000); }
function narrow(){ return window.innerWidth < CONFIG.NARROW; }
const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_MINI = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function pretty(k){ const d=fromKey(k); return d.getDate()+' '+MONTH[d.getMonth()]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,kind){
  const el=document.createElement('div'); el.className='toast '+(kind||''); el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); },3000);
}

const FREQS = [
  {id:'daily',label:'Every day',n:1},{id:'every2',label:'Every 2 days',n:2},
  {id:'every3',label:'Every 3 days',n:3},{id:'every4',label:'Every 4 days',n:4},
  {id:'every5',label:'Every 5 days',n:5},{id:'every6',label:'Every 6 days',n:6},
  {id:'every7',label:'Every 7 days',n:7},{id:'biweekly',label:'Every 2 weeks',n:14},
  {id:'triweekly',label:'Every 3 weeks',n:21},{id:'monthly',label:'Once a month',n:30},
  {id:'whenever',label:'Whenever',n:null}
];
const freq = id => FREQS.find(f=>f.id===id) || FREQS[0];

const MOODS = [
  {id:'terrible',em:'😣',label:'Terrible',c:'var(--mood-terrible)'},
  {id:'okay',em:'😐',label:'Okay',c:'var(--mood-okay)'},
  {id:'alright',em:'🙂',label:'Alright',c:'var(--mood-alright)'},
  {id:'good',em:'😊',label:'Good',c:'var(--mood-good)'},
  {id:'happy',em:'😄',label:'Happy',c:'var(--mood-happy)'}
];
const mood = id => MOODS.find(m=>m.id===id);
const ILLNESSES = ['Cold','Flu','Strep throat','Stomach bug','Migraine','Fever','Headache'];

const ICON = {
  habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  event:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
  health:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 000-7.8z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  year:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 3a2.8 2.8 0 014 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l6-6-6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  kebab:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><path d="M12 11v6M9 14h6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.6 13.4L12 22l-9-9V3h10z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>'
};

/* ══ state ════════════════════════════════ */
const S = {
  schemaVersion: CONFIG.SCHEMA, deviceId:null,
  habits:{}, groups:{}, illnesses:{}, days:{},

  collapsed: new Set(),     // folded groups — local only, not synced
  page:'habits', month:new Date(), year:new Date().getFullYear(), yearTab:'heatmap',
  sheetDate:null,
  editing:null,             // date key currently open for editing
  draft:null,               // {key, day} — unsaved edits live here
  addingIllness:false,

  signedIn:false, email:null, token:null, tokenExp:0, client:null,
  authHint:null, everSignedIn:false, interactive:false, gisReady:false,
  fileId:null, remoteStamp:null, dirty:false, saveTimer:null
};

/* ══ local store ══════════════════════════ */
let _db=null;
function db(){
  if(_db) return _db;
  _db=new Promise((ok,no)=>{
    const r=indexedDB.open('journal-db',1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);
  });
  return _db;
}
async function kvGet(k){ const d=await db(); return new Promise((ok,no)=>{
  const q=d.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error); }); }
async function kvPut(k,v){ const d=await db(); return new Promise((ok,no)=>{
  const q=d.transaction('kv','readwrite').objectStore('kv').put(v,k); q.onsuccess=()=>ok(); q.onerror=()=>no(q.error); }); }

async function loadLocal(){
  const x=await kvGet('state');
  if(x){
    S.schemaVersion=x.schemaVersion||CONFIG.SCHEMA;
    S.deviceId=x.deviceId||null;
    S.habits=x.habits||{}; S.groups=x.groups||{};
    S.illnesses=x.illnesses||{}; S.days=x.days||{};
    S.fileId=x.fileId||null; S.remoteStamp=x.remoteStamp||null;
  }
  const c=await kvGet('collapsed');
  if(Array.isArray(c)) S.collapsed=new Set(c);
  if(!S.deviceId) S.deviceId=uid();
  await saveLocal();
}
function saveLocal(){
  return kvPut('state',{
    schemaVersion:S.schemaVersion, deviceId:S.deviceId,
    habits:S.habits, groups:S.groups, illnesses:S.illnesses, days:S.days,
    fileId:S.fileId, remoteStamp:S.remoteStamp
  });
}
function saveCollapsed(){ kvPut('collapsed',[...S.collapsed]); }

/* ══ caches ═══════════════════════════════ */
let stamp=0, cDone={}, cDoneAt=-1, cSick=null, cSickAt=-1;
function bump(){ stamp++; }
function doneDates(hid){
  if(cDoneAt!==stamp){ cDone={}; cDoneAt=stamp; }
  if(!cDone[hid]){
    const out=[];
    for(const k in S.days){ const h=S.days[k].habits; if(h&&h[hid]&&h[hid].done) out.push(k); }
    out.sort(); cDone[hid]=out;
  }
  return cDone[hid];
}
function sickDates(){
  if(cSickAt!==stamp){
    const out=[]; for(const k in S.days) if(S.days[k].sick) out.push(k);
    out.sort(); cSick=out; cSickAt=stamp;
  }
  return cSick;
}
function lastBefore(a,l){ let lo=0,hi=a.length-1,r=null; while(lo<=hi){const m=(lo+hi)>>1; if(a[m]<l){r=a[m];lo=m+1;}else hi=m-1;} return r; }

/* ══ draft-aware reads ════════════════════
   While a day is open for editing, every read of that day comes
   from the draft, so the screen shows unsaved work and the real
   data stays untouched until Save.                              */
function dayFor(k){
  if(S.draft && S.draft.key===k) return S.draft.day;
  return S.days[k] || null;
}
function blankDay(k){ return {date:k,habits:{},event:'',mood:null,moodNote:'',sick:null,updatedAt:nowISO()}; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ══ mutations ════════════════════════════ */
function day(k){ if(!S.days[k]) S.days[k]=blankDay(k); return S.days[k]; }
function commit(k){
  if(k) day(k).updatedAt=nowISO();
  S.dirty=true; bump(); saveLocal();
  if(S.signedIn){ clearTimeout(S.saveTimer); S.saveTimer=setTimeout(syncNow,CONFIG.DEBOUNCE); }
}
/* writes go to the draft when one is open for that day */
function writeDay(k, fn){
  if(S.draft && S.draft.key===k){ fn(S.draft.day); drawSheet(); return; }
  fn(day(k)); commit(k);
}
function tickHabit(k,hid,on){
  writeDay(k,d=>{ if(!d.habits) d.habits={};
    if(on) d.habits[hid]={done:true,doneAt:nowISO()}; else delete d.habits[hid]; });
}
function putEvent(k,t){ writeDay(k,d=>{d.event=t;}); }
function putMood(k,m){ writeDay(k,d=>{d.mood=m;}); }
function putMoodNote(k,t){ writeDay(k,d=>{d.moodNote=t;}); }
function putSick(k,v){ writeDay(k,d=>{d.sick=v;}); }

function addHabit(name,f,groupId){
  const id=uid();
  let top=0; for(const i in S.habits) if(S.habits[i].groupId===(groupId||null)) top=Math.max(top,S.habits[i].order||0);
  S.habits[id]={id,name:String(name).trim().slice(0,70),frequency:f,groupId:groupId||null,
    createdAt:today(),deletedAt:null,order:top+1,updatedAt:nowISO()};
  commit(null); return id;
}
function editHabit(id,patch){ if(!S.habits[id])return; Object.assign(S.habits[id],patch,{updatedAt:nowISO()}); commit(null); }
function dropHabit(id){ if(!S.habits[id])return; S.habits[id].deletedAt=nowISO(); S.habits[id].updatedAt=nowISO(); commit(null); }

function addGroup(name){
  const id=uid();
  let top=0; for(const i in S.groups) top=Math.max(top,S.groups[i].order||0);
  S.groups[id]={id,name:String(name).trim().slice(0,50),order:top+1,deletedAt:null,updatedAt:nowISO()};
  commit(null); return id;
}
function editGroup(id,patch){ if(!S.groups[id])return; Object.assign(S.groups[id],patch,{updatedAt:nowISO()}); commit(null); }
function dropGroup(id){
  if(!S.groups[id])return;
  for(const hid in S.habits) if(S.habits[hid].groupId===id){     // habits survive, they just leave the group
    S.habits[hid].groupId=null; S.habits[hid].updatedAt=nowISO();
  }
  S.groups[id].deletedAt=nowISO(); S.groups[id].updatedAt=nowISO();
  S.collapsed.delete(id); saveCollapsed();
  commit(null);
}

function allIllnesses(){
  const extra=[];
  for(const id in S.illnesses){ const x=S.illnesses[id]; if(!x.deletedAt) extra.push(x); }
  extra.sort((a,b)=>(a.order||0)-(b.order||0));
  return ILLNESSES.map(n=>({name:n,builtin:true})).concat(extra.map(x=>({name:x.name,id:x.id,builtin:false})));
}
function addIllness(name){
  name=String(name).trim().slice(0,40); if(!name) return null;
  if(allIllnesses().some(x=>x.name.toLowerCase()===name.toLowerCase())) return name;
  const id=uid(); let top=0; for(const i in S.illnesses) top=Math.max(top,S.illnesses[i].order||0);
  S.illnesses[id]={id,name,order:top+1,deletedAt:null,updatedAt:nowISO()};
  commit(null); return name;
}
function dropIllness(id){ if(!S.illnesses[id])return; S.illnesses[id].deletedAt=nowISO(); S.illnesses[id].updatedAt=nowISO(); commit(null); }

/* ══ sick carry (capped at today) ═════════ */
function sickOn(k){
  const own=(dayFor(k)||{}).sick;
  if(own) return Object.assign({},own,{explicit:true,startedOn:runStart(k)});
  if(k>today()) return null;
  const prev=lastBefore(sickDates(),k);
  if(!prev) return null;
  const e=S.days[prev].sick;
  if(e.status!=='sick') return null;
  return Object.assign({},e,{explicit:false,carriedFrom:prev,startedOn:prev});
}
function runStart(k){
  const arr=sickDates(); let start=k,i=arr.indexOf(k);
  if(i===-1){ const p=lastBefore(arr,k); if(p==null) return k; i=arr.indexOf(p); start=p; }
  while(i>0){ const prev=arr[i-1]; if(S.days[prev].sick.status!=='sick') break; start=prev; i--; }
  return start;
}

/* ══ habit state ══════════════════════════ */
function habitOn(h,k){
  const f=freq(h.frequency), d=dayFor(k);
  const done=!!(d&&d.habits&&d.habits[h.id]&&d.habits[h.id].done);
  if(f.n===null) return {done,missed:false,over:0};
  if(done) return {done:true,missed:false,over:0};
  if(k<h.createdAt) return {done:false,missed:false,over:0,before:true};
  if(k>today()) return {done:false,missed:false,over:0,future:true};
  const last=lastBefore(doneDates(h.id),k);
  const over=span(last||h.createdAt,k)-f.n;
  return over>0 ? {done:false,missed:true,over,last} : {done:false,missed:false,over:0,last,dueIn:-over};
}
function liveHabits(groupId){
  const out=[];
  for(const id in S.habits){
    const h=S.habits[id];
    if(h.deletedAt) continue;
    if(groupId!==undefined && (h.groupId||null)!==groupId) continue;
    out.push(h);
  }
  return out.sort((a,b)=>(a.order||0)-(b.order||0));
}
function liveGroups(){
  const out=[];
  for(const id in S.groups){ const g=S.groups[id]; if(!g.deletedAt) out.push(g); }
  return out.sort((a,b)=>(a.order||0)-(b.order||0));
}
function missedCount(k){ let n=0; for(const h of liveHabits()) if(habitOn(h,k).missed) n++; return n; }

/* ══ edit gate + draft ════════════════════ */
function canEdit(k){ return S.editing===k; }

function beginEdit(k){
  S.editing=k;
  S.draft={ key:k, day: clone(S.days[k] || blankDay(k)) };
  drawSheet();
}
function askEdit(k){
  if(k===today()){ beginEdit(k); return; }      // today needs no warning
  const d=fromKey(k);
  ask({
    title:'Edit this day?',
    body:'You are about to change what is saved for '+DOW_LONG[d.getDay()]+', '+pretty(k)+
         '. Nothing is written until you press Save.',
    yes:'Yes, edit', no:'No, keep it closed',
    onYes(){ beginEdit(k); }
  });
}
function saveEdit(){
  const dr=S.draft; if(!dr) return;
  const d=dr.day;
  const empty = !d.mood && !d.moodNote && !d.sick && !(d.event||'').trim() &&
                !Object.keys(d.habits||{}).length;
  if(empty && !S.days[dr.key]){                  // nothing was entered — don't create a hollow record
    S.editing=null; S.draft=null; bump(); drawSheet(); toast('Nothing to save'); return;
  }
  d.updatedAt=nowISO();
  S.days[dr.key]=d;
  S.editing=null; S.draft=null;
  S.dirty=true; bump(); saveLocal();
  if(S.signedIn){ clearTimeout(S.saveTimer); S.saveTimer=setTimeout(syncNow,CONFIG.DEBOUNCE); }
  drawSheet(); draw();
  toast('Saved','good');
}
function draftDirty(){
  if(!S.draft) return false;
  const before=JSON.stringify(S.days[S.draft.key] || blankDay(S.draft.key));
  const after=JSON.stringify(S.draft.day);
  // ignore the timestamp when comparing
  return before.replace(/"updatedAt":"[^"]*"/,'') !== after.replace(/"updatedAt":"[^"]*"/,'');
}
function cancelEdit(force){
  if(!force && draftDirty()){
    ask({ title:'Throw away your changes?',
          body:'You have edits on this day that have not been saved.',
          yes:'Yes, discard', no:'Keep editing', danger:true,
          onYes(){ S.editing=null; S.draft=null; drawSheet(); } });
    return;
  }
  S.editing=null; S.draft=null; drawSheet();
}

/* ══ auth ═════════════════════════════════ */
function loadGIS(){
  return new Promise((ok,no)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2) return ok();
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
    s.onload=ok; s.onerror=no; document.head.appendChild(s);
  });
}
function originBlocker(){
  if(location.protocol==='file:') return 'file';
  const local=location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(location.protocol!=='https:'&&!local) return 'insecure';
  return null;
}
function authBlocker(){ return originBlocker() || (S.gisReady&&S.client?null:'gis'); }
const BLOCKER_TEXT={
  file:{title:'Open the web address instead',body:'This page is running straight from a file on your phone. Google can only sign in when the app is served from its GitHub Pages address, so open that link and sign in there. Everything you write offline is kept and will sync once you do.'},
  insecure:{title:'Needs a secure address',body:'Google only allows sign-in over https. Open the app on its GitHub Pages address and try again.'},
  gis:{title:'Google sign-in did not load',body:'The Google script could not be reached, usually a network or content blocker. Check your connection and reload the page. The journal keeps working offline in the meantime.'}
};
async function initAuth(){
  try{ await loadGIS(); S.gisReady=true; }catch(_){ S.gisReady=false; }
  S.authHint=await kvGet('authHint');
  S.everSignedIn=!!(await kvGet('everSignedIn'));
  if(S.authHint) S.email=S.authHint;
  if(!S.gisReady||originBlocker()){ drawMenu(); setSync('','Local only'); return; }

  S.client=google.accounts.oauth2.initTokenClient({
    client_id:CONFIG.GOOGLE_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
    callback:async r=>{
      const wasTap=S.interactive; S.interactive=false;
      if(r.error){
        if(!wasTap){ S.signedIn=false; drawMenu(); setSync(S.authHint?'bad':'',S.authHint?'Tap to resume':'Local only'); return; }
        setSync('bad','Sign-in failed'); toast(authErrorText(r.error),'bad'); drawMenu(); return;
      }
      S.token=r.access_token; S.tokenExp=Date.now()+(r.expires_in-60)*1000;
      S.signedIn=true; S.everSignedIn=true;
      await kvPut('everSignedIn',true); await whoAmI(); drawMenu(); await firstSync();
    },
    error_callback:err=>{
      const wasTap=S.interactive; S.interactive=false;
      if(!wasTap) return;
      const t=err&&err.type;
      if(t==='popup_failed_to_open'){
        setSync('bad','Pop-up blocked');
        ask({title:'Your browser blocked the pop-up',body:'Google signs you in through a pop-up window. Allow pop-ups for this site in your browser settings, then tap sign in again.',yes:'Got it',no:'Close',onYes(){}});
      } else if(t==='popup_closed'){ setSync('bad','Sign-in cancelled'); toast('Sign-in window was closed before it finished.'); }
      else { setSync('bad','Sign-in failed'); toast('Sign-in could not start. Please try again.','bad'); }
      drawMenu();
    }
  });
  drawMenu();
  if(S.everSignedIn) setTimeout(()=>{ S.interactive=false;
    try{ S.client.requestAccessToken({prompt:'',hint:S.authHint||undefined}); }catch(_){ setSync('bad','Tap to resume'); } },400);
}
function authErrorText(c){
  if(c==='access_denied') return 'Google declined the request. Check the app is allowed to use your Drive.';
  if(c==='immediate_failed'||c==='interaction_required') return 'Google needs you to pick an account. Tap sign in again.';
  return 'Sign-in failed: '+c;
}
function startSignIn(){
  const b=authBlocker();
  if(b){ const t=BLOCKER_TEXT[b]; ask({title:t.title,body:t.body,yes:'Got it',no:'Close',onYes(){}}); return; }
  S.interactive=true; setSync('busy','Opening Google');
  try{ S.client.requestAccessToken({prompt:S.everSignedIn?'select_account':'consent',hint:S.authHint||undefined}); }
  catch(e){ S.interactive=false; setSync('bad','Sign-in failed'); toast('Sign-in could not start: '+e.message,'bad'); }
}
function freshToken(){
  if(S.token&&Date.now()<S.tokenExp) return Promise.resolve(S.token);
  if(!S.client) return Promise.reject(new Error('Not signed in'));
  return new Promise((ok,no)=>{
    let settled=false; const prev=S.client.callback;
    const restore=()=>{S.client.callback=prev;};
    const bail=setTimeout(()=>{ if(settled)return; settled=true; restore();
      S.signedIn=false; drawMenu(); no(new Error('Google did not respond. Sign in again.')); },20000);
    S.client.callback=r=>{
      if(settled)return; settled=true; clearTimeout(bail); restore();
      if(r.error){ S.signedIn=false; drawMenu(); return no(new Error(authErrorText(r.error))); }
      S.token=r.access_token; S.tokenExp=Date.now()+(r.expires_in-60)*1000; ok(r.access_token);
    };
    S.interactive=false;
    try{ S.client.requestAccessToken({prompt:'',hint:S.authHint||undefined}); }
    catch(e){ if(settled)return; settled=true; clearTimeout(bail); restore(); no(e); }
  });
}
async function whoAmI(){
  try{
    const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{Authorization:'Bearer '+S.token}});
    if(r.ok){ const j=await r.json(); S.email=j.email; await kvPut('authHint',j.email); }
  }catch(_){}
}

/* ══ drive ════════════════════════════════ */
async function api(path,opts){
  const t=await freshToken(); opts=opts||{};
  const r=await fetch('https://www.googleapis.com/'+path,Object.assign({},opts,{
    headers:Object.assign({},opts.headers||{},{Authorization:'Bearer '+t})}));
  if(!r.ok) throw new Error('Drive '+r.status+': '+(await r.text()).slice(0,160));
  return r;
}
function payload(){
  return {schemaVersion:CONFIG.SCHEMA,updatedAt:nowISO(),deviceId:S.deviceId,
          habits:S.habits,groups:S.groups,illnesses:S.illnesses,days:S.days};
}
async function folderId(){
  const q=encodeURIComponent("name='"+CONFIG.FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const j=await (await api('drive/v3/files?q='+q+'&fields=files(id)&spaces=drive')).json();
  if(j.files&&j.files.length) return j.files[0].id;
  const c=await (await api('drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:CONFIG.FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'})})).json();
  return c.id;
}
async function locate(){
  if(S.fileId){ try{ const j=await (await api('drive/v3/files/'+S.fileId+'?fields=id,trashed')).json(); if(!j.trashed) return j; }catch(_){ S.fileId=null; } }
  const q=encodeURIComponent("name='"+CONFIG.FILE_NAME+"' and trashed=false");
  const j=await (await api('drive/v3/files?q='+q+'&fields=files(id)&spaces=drive')).json();
  if(j.files&&j.files.length){ S.fileId=j.files[0].id; await saveLocal(); return j.files[0]; }
  return null;
}
async function createFile(){
  const parent=await folderId();
  const meta={name:CONFIG.FILE_NAME,parents:[parent],mimeType:'application/json'};
  const body=payload(), b='b'+Date.now();
  const multi='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n'+
              '--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(body)+'\r\n--'+b+'--';
  const j=await (await api('upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',
    headers:{'Content-Type':'multipart/related; boundary='+b},body:multi})).json();
  S.fileId=j.id; S.remoteStamp=body.updatedAt; await saveLocal();
}
async function pull(){ if(!S.fileId) return null; return (await api('drive/v3/files/'+S.fileId+'?alt=media')).json(); }
async function push(){
  if(!S.fileId) return createFile();
  const body=payload();
  await api('upload/drive/v3/files/'+S.fileId+'?uploadType=media&fields=id',{method:'PATCH',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  S.remoteStamp=body.updatedAt; await saveLocal();
}
function mergeMap(local,remote){
  let touched=false;
  for(const id in remote){
    const a=remote[id],b=local[id];
    if(!b||new Date(a.updatedAt)>new Date(b.updatedAt)){ local[id]=a; touched=true; }
  }
  return touched;
}
function merge(remote){
  if(!remote) return false;
  let t=false;
  t = mergeMap(S.habits,remote.habits||{}) || t;
  t = mergeMap(S.groups,remote.groups||{}) || t;
  t = mergeMap(S.illnesses,remote.illnesses||{}) || t;
  t = mergeMap(S.days,remote.days||{}) || t;
  if(t) bump();
  return t;
}
let busy=false;
async function firstSync(){
  if(!S.signedIn) return;
  setSync('busy','Syncing');
  try{
    if(!await locate()) await createFile();
    else{
      const r=await pull();
      if(merge(r)){ await saveLocal(); draw(); }
      S.remoteStamp=r.updatedAt;
      if(S.dirty) await push();
      await saveLocal();
    }
    setSync('ok','Synced');
  }catch(e){ console.error(e); setSync('bad','Sync failed'); toast(e.message,'bad'); }
}
async function syncNow(){
  if(!S.signedIn){ toast('Sign in to sync'); return; }
  if(busy) return;
  busy=true; setSync('busy','Syncing');
  try{
    if(!await locate()) await createFile();
    else{
      const r=await pull();
      if(merge(r)){ await saveLocal(); draw(); if(S.sheetDate) drawSheet(); }
      S.remoteStamp=r.updatedAt; await push();
    }
    S.dirty=false; await saveLocal(); setSync('ok','Synced');
  }catch(e){ console.error(e); setSync('bad','Sync failed'); toast(e.message,'bad'); }
  finally{ busy=false; }
}

/* ══ chrome ═══════════════════════════════ */
function setSync(cls,label){ const el=$('#sync'); el.className='sync '+(cls||''); el.title=label||''; }
function drawMenu(){
  const w=$('#who'), b=authBlocker();
  if(S.signedIn) w.textContent=S.email||'Signed in';
  else if(b==='file'||b==='insecure') w.textContent='Offline — opened as a local file';
  else if(b==='gis') w.textContent='Google sign-in unavailable';
  else if(S.email) w.textContent=S.email+' — signed out';
  else w.textContent='Not signed in';
  $('#signinBtn').lastChild.textContent=(!S.signedIn&&S.email)?' Sign in again':' Sign in to Google';
  $('#signinBtn').style.display=S.signedIn?'none':'flex';
  $('#signoutBtn').style.display=S.signedIn?'flex':'none';
  $('#whyBtn').style.display=(!S.signedIn&&b)?'flex':'none';
}
const PAGES=[{id:'habits',label:'Habits',icon:'habits'},{id:'event',label:'Event',icon:'event'},
             {id:'health',label:'Health',icon:'health'},{id:'cal',label:'Calendar',icon:'cal'},
             {id:'year',label:'Year',icon:'year'}];
function drawNav(){
  const miss=missedCount(today());
  $('#nav').innerHTML=PAGES.map(p=>{
    const badge=(p.id==='habits'&&miss)?'<em class="badge">'+miss+'</em>':'';
    return '<button data-act="page" data-page="'+p.id+'" aria-current="'+(S.page===p.id)+'">'+
      ICON[p.icon]+'<span>'+p.label+'</span>'+badge+'</button>';
  }).join('');
}
function drawHeader(){
  const d=new Date();
  let ctx;
  if(S.page==='cal') ctx='Tap a day to look back';
  else if(S.page==='year') ctx='Your year at a glance';
  else { const n=missedCount(today()); ctx=n?n+(n===1?' habit overdue':' habits overdue'):'Everything on track'; }
  $('#headDate').innerHTML='<span class="dow">'+DOW_LONG[d.getDay()]+'</span>'+
    '<span class="md">'+d.getDate()+' '+MONTH[d.getMonth()]+'</span>'+
    '<div class="ctx">'+esc(ctx)+'</div>';
}

/* ══ habit rendering ══════════════════════ */
function habitCard(h,k,editable,drag){
  const st=habitOn(h,k), f=freq(h.frequency);
  let sub;
  if(f.n===null) sub='Whenever you like';
  else if(st.done) sub='Done — next in '+f.n+(f.n===1?' day':' days');
  else if(st.missed) sub='Was due '+st.over+(st.over===1?' day':' days')+' ago';
  else if(st.before) sub='Added '+pretty(h.createdAt);
  else if(st.future) sub=f.label;
  else if(st.dueIn>0) sub='Due in '+st.dueIn+(st.dueIn===1?' day':' days');
  else sub='Due today';

  const cls='habit '+(st.done?'done ':st.missed?'miss ':'')+(st.before?'pre':'');
  return '<div class="'+cls.trim()+'" data-sortable="habit" data-id="'+h.id+'">'+
    (drag?'<span class="grip" data-grip="habit" data-id="'+h.id+'" aria-label="Reorder '+esc(h.name)+'">'+ICON.grip+'</span>':'')+
    '<button class="tap"'+(editable?' data-act="tick" data-h="'+h.id+'" data-k="'+k+'"':' disabled')+
      ' aria-pressed="'+st.done+'">'+
      '<span class="tick">'+ICON.check+'</span>'+
      '<span class="body"><span class="nm">'+esc(h.name)+'</span>'+
        '<span class="sub">'+esc(sub)+'</span></span>'+
    '</button>'+
    (st.missed?'<span class="miss-tag">'+ICON.warn+'<span class="fig">'+st.over+'d</span></span>':'')+
    (editable?'<button class="kebab" data-act="hmenu" data-h="'+h.id+'" aria-label="Options for '+esc(h.name)+'">'+ICON.kebab+'</button>':'')+
  '</div>';
}

function habitsBlock(k,editable,drag){
  const groups=liveGroups(), loose=liveHabits(null);
  if(!groups.length && !loose.length){
    return '<div class="empty"><h3>No habits yet</h3><p>Add the first thing you want to keep track of.</p></div>';
  }
  let html='<div class="droplist" data-droplist="" data-group="">'+
    loose.map(h=>habitCard(h,k,editable,drag)).join('')+'</div>';

  for(const g of groups){
    const list=liveHabits(g.id);
    const open=!S.collapsed.has(g.id);
    let done=0,miss=0;
    for(const h of list){ const s=habitOn(h,k); if(s.done)done++; if(s.missed)miss++; }
    const cc = miss?'bad':(list.length&&done===list.length?'all':'');
    html+='<div class="group '+(open?'open':'')+'" data-sortable="group" data-id="'+g.id+'">'+
      '<div class="g-head">'+
        (drag?'<span class="grip" data-grip="group" data-id="'+g.id+'" aria-label="Reorder '+esc(g.name)+'">'+ICON.grip+'</span>':'')+
        '<button class="g-open" data-act="fold" data-g="'+g.id+'" aria-expanded="'+open+'">'+
          '<span class="g-chev">'+ICON.chev+'</span>'+
          '<span class="g-nm">'+esc(g.name)+'</span>'+
          '<span class="g-count fig '+cc+'">'+done+'/'+list.length+'</span>'+
        '</button>'+
        (editable?'<button class="kebab" data-act="gmenu" data-g="'+g.id+'" aria-label="Options for '+esc(g.name)+'">'+ICON.kebab+'</button>':'')+
      '</div>'+
      '<div class="g-body"><div class="droplist" data-droplist="" data-group="'+g.id+'">'+
        (list.length?list.map(h=>habitCard(h,k,editable,drag)).join(''):'<div class="g-empty">Nothing in here yet</div>')+
      '</div></div>'+
    '</div>';
  }

  const all=liveHabits();
  let done=0,miss=0;
  for(const h of all){ const s=habitOn(h,k); if(s.done)done++; if(s.missed)miss++; }
  html+='<div class="tally">'+
    '<div class="grn"><span class="n fig">'+done+'</span><span class="l">done</span></div>'+
    '<div class="'+(miss?'red':'')+'"><span class="n fig">'+miss+'</span><span class="l">'+(miss===1?'day missed':'days missed')+'</span></div>'+
    '<div><span class="n fig">'+all.length+'</span><span class="l">tracked</span></div></div>';
  return html;
}

function moodBlock(k,editable){
  const e=dayFor(k)||{}, cur=e.mood, note=e.moodNote||'';
  return '<div class="moods">'+MOODS.map(m=>
      '<button class="mood '+(cur===m.id?'on':'')+'" data-m="'+m.id+'"'+

      (editable?' data-act="moodnote" data-k="'+k+'"':' readonly')+'>'+esc(note)+'</textarea>';
}

function healthBlock(k,editable){
  const own=(dayFor(k)||{}).sick, eff=sickOn(k);
  const status=own?own.status:(eff?eff.status:null);
  const carried=!!eff&&!own;
  let html='<div class="seg">'+
    '<button class="'+(status==='fine'?'on-fine':'')+'"'+(editable?' data-act="sick" data-v="fine" data-k="'+k+'"':' disabled')+'>Fine</button>'+
    '<button class="'+(status==='sick'?'on-sick':'')+'"'+(editable?' data-act="sick" data-v="sick" data-k="'+k+'"':' disabled')+'>Sick'+
      (carried?'<span class="carry">carried over</span>':'')+'</button></div>';
  if(status==='sick'){
    const ill=(own&&own.illness)||(eff&&eff.illness)||null;
    const note=(own&&own.note)||(eff&&eff.note)||'';
    const opts=allIllnesses();
    const orphan=ill&&!opts.some(o=>o.name===ill);
    html+='<div class="sickbox"><h3>What is it?</h3><div class="chips">'+
      opts.map(o=>{
        const rm=!o.builtin&&editable;
        return '<span class="chip-wrap"><button class="chip '+(ill===o.name?'on ':'')+(rm?'has-x':'')+'"'+
          (editable?' data-act="ill" data-v="'+esc(o.name)+'" data-k="'+k+'"':' disabled')+'>'+esc(o.name)+'</button>'+
          (rm?'<button class="chip-x" data-act="illdrop" data-id="'+o.id+'" aria-label="Remove '+esc(o.name)+'">&times;</button>':'')+
        '</span>';
      }).join('')+
      (orphan?'<span class="chip-wrap"><button class="chip on" disabled>'+esc(ill)+'</button></span>':'')+
      (editable&&!S.addingIllness?'<button class="chip chip-add" data-act="illnew">+ New illness</button>':'')+
      '</div>'+
      (editable&&S.addingIllness?'<form class="ill-add" data-act="illsave" data-k="'+k+'">'+
        '<input name="iname" placeholder="Name the illness" maxlength="40" autocomplete="off">'+
        '<button type="submit" class="btn btn-sm btn-lamp">Add</button>'+
        '<button type="button" class="btn btn-sm btn-quiet" data-act="illcancel">Cancel</button></form>':'')+
      '<h3>Notes while you are ill</h3>'+
      '<textarea class="sick-note" placeholder="Symptoms, medicine, how you slept…"'+
        (editable?' data-act="sicknote" data-k="'+k+'"':' readonly')+'>'+esc(note)+'</textarea>';
    const start=eff?eff.startedOn:k, n=span(start,k)+1;
    if(n>=CONFIG.SICK_NUDGE_AFTER)
      html+='<div class="day-of">'+ICON.info+'<span>Day '+n+' of '+esc(ill||'this')+'. Mark yourself Fine on the day it ends.</span></div>';
    else if(carried)
      html+='<div class="day-of">'+ICON.info+'<span>Day '+n+', carried over from '+esc(pretty(start))+'. It stops as soon as you mark a day Fine.</span></div>';
    html+='</div>';
  }
  return html;
}

function eventBlock(k,editable){
  const txt=(dayFor(k)||{}).event||'';
  const w=txt.trim()?txt.trim().split(/\s+/).length:0;
  return '<div class="note-wrap"><textarea class="note" placeholder="What happened today?"'+
    (editable?' data-act="event" data-k="'+k+'"':' readonly')+'>'+esc(txt)+'</textarea>'+

    '<span>'+(editable?'Saved when you press Save':'Read only')+'</span></div></div>';
}

function pageCal(){
  const c=S.month,y=c.getFullYear(),m=c.getMonth();
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const len=new Date(y,m+1,0).getDate(), prevLen=new Date(y,m,0).getDate();
  const tk=today();
  let cells='';
  for(let i=0;i<42;i++){
    let num,off;
    if(i<lead){num=prevLen-lead+1+i;off=-1;}
    else if(i>=lead+len){num=i-lead-len+1;off=1;}
    else{num=i-lead+1;off=0;}
    const dt=new Date(y,m+off,num),k=key(dt);
    const e=S.days[k],sk=sickOn(k);
    const mo=e&&e.mood?mood(e.mood):null;
    const pips=liveHabits().slice(0,8).map(h=>{
      const st=habitOn(h,k);
      return '<i class="'+(st.done?'d':st.missed?'m':'')+'"></i>';
    }).join('');
    const hz=sk?(sk.status==='sick'?'<span class="hz s">SICK</span>':'<span class="hz f">FINE</span>'):'<span class="hz"></span>';
    const em=mo?'<span class="em">'+mo.em+'</span>':'<span class="em"></span>';
    cells+='<button class="cell '+(off?'out ':'')+(k===tk?'now':'')+'" data-act="open" data-k="'+k+'">'+
      '<span class="d fig">'+num+'</span>'+em+hz+'<span class="pips">'+pips+'</span>'+
      (e&&e.event&&e.event.trim()?'<span class="nt"></span>':'')+'</button>';
  }
  return '<div class="cal-bar"><h2>'+MONTH[m]+' <i class="fig">'+y+'</i></h2><div class="stepper">'+
    '<button data-act="mon" data-d="-1" aria-label="Previous month">'+ICON.prev+'</button>'+
    '<button class="btn btn-quiet btn-sm" data-act="mon" data-d="0">Today</button>'+
    '<button data-act="mon" data-d="1" aria-label="Next month">'+ICON.next+'</button></div></div>'+
    '<div class="dow-row">'+DOW_MINI.map(d=>'<span>'+d+'</span>').join('')+'</div>'+
    '<div class="cal">'+cells+'</div>';
}

function pageYear(){
  return '<div class="toggle2">'+
    '<button class="'+(S.yearTab==='heatmap'?'on':'')+'" data-act="ytab" data-v="heatmap">Heatmap</button>'+
    '<button class="'+(S.yearTab==='summary'?'on':'')+'" data-act="ytab" data-v="summary">Summary</button></div>'+

function heatCell(k,inY,tk){
  const e=S.days[k],sk=sickOn(k),m=e&&e.mood;
  const cls='hcell '+(inY?'':'gh ')+(sk&&sk.status==='sick'?'sk ':'')+(k===tk?'tdy':'');
  const tip=pretty(k)+(m?', '+mood(m).label.toLowerCase():'')+(sk&&sk.status==='sick'?', sick':'');
  return '<button class="'+cls.trim()+'"'+(m?' data-m="'+m+'"':'')+
    ' data-act="open" data-k="'+k+'" title="'+esc(tip)+'"></button>';
}
function heatmapView(){
  const y=S.year, jan=new Date(y,0,1);
  const start=shift(jan,-((jan.getDay()+6)%7));
  const tk=today();
  const bar='<div class="cal-bar"><h2 class="fig">'+y+'</h2><div class="stepper">'+
    '<button data-act="yr" data-d="-1" aria-label="Previous year">'+ICON.prev+'</button>'+
    '<button data-act="yr" data-d="1" aria-label="Next year">'+ICON.next+'</button></div></div>';
  const legend='<div class="key">'+MOODS.map(m=>'<div><i style="background:'+m.c+'"></i>'+m.label+'</div>').join('')+
    '<div><i style="background:var(--raised);box-shadow:0 0 0 1.5px var(--sick) inset"></i>Sick</div></div>';

  if(narrow()){
    /* phone: twelve small months, read like a wall calendar */
    let months='';
    for(let m=0;m<12;m++){
      const lead=(new Date(y,m,1).getDay()+6)%7;
      const len=new Date(y,m+1,0).getDate();
      let g='';
      for(let i=0;i<lead;i++) g+='<span class="blank"></span>';
      for(let dnum=1;dnum<=len;dnum++) g+=heatCell(key(new Date(y,m,dnum)),true,tk);
      months+='<div class="mini"><div class="mini-h">'+MONTH[m]+'</div>'+
              '<div class="mini-g">'+g+'</div></div>';
    }
    return bar+'<div class="heat-v">'+months+'</div>'+legend;
  }

  /* desktop: weeks run across */
  let weeks='',months='',d=new Date(start);
  for(let w=0;w<53;w++){
    let col='',label='';
    for(let r=0;r<7;r++){
      const k=key(d),inY=d.getFullYear()===y;
      if(r===0&&inY&&d.getDate()<=7) label=MONTH[d.getMonth()].slice(0,3);
      col+=heatCell(k,inY,tk); d=shift(d,1);
    }
    weeks+='<div class="wk">'+col+'</div>'; months+='<span>'+label+'</span>';
  }
  return bar+'<div class="scroller"><div class="mon-row">'+months+'</div>'+
    '<div class="heat">'+weeks+'</div></div>'+legend;
}

function summaryView(){
  const c=S.month,y=c.getFullYear(),m=c.getMonth();
  const len=new Date(y,m+1,0).getDate();
  const counts={terrible:0,okay:0,alright:0,good:0,happy:0};
  let logged=0,sickDays=0,written=0;
  for(let i=1;i<=len;i++){
    const k=key(new Date(y,m,i)),e=S.days[k];
    if(e&&e.mood){counts[e.mood]++;logged++;}
    const sk=sickOn(k); if(sk&&sk.status==='sick') sickDays++;
    if(e&&e.event&&e.event.trim()) written++;
  }
  const bar=MOODS.map(mm=>{const p=logged?counts[mm.id]/logged*100:0;
    return p?'<div style="width:'+p+'%;background:'+mm.c+'"></div>':'';}).join('');
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const topLabel=logged&&counts[top]?mood(top).label:'—';
  const rows=liveHabits().map(h=>{
    const f=freq(h.frequency); let expect=0,got=0;
    for(let i=1;i<=len;i++){
      const k=key(new Date(y,m,i));
      if(k<h.createdAt) continue;
      if(f.n!==null&&span(h.createdAt,k)%f.n===0) expect++;
      const e=S.days[k]; if(e&&e.habits&&e.habits[h.id]&&e.habits[h.id].done) got++;
    }
    const pct=expect?Math.round(got/expect*100):(f.n===null?null:0);
    return {h,f,got,expect,pct};
  }).sort((a,b)=>(b.pct===null?-1:b.pct)-(a.pct===null?-1:a.pct));
  const habitRows=rows.length?rows.map(r=>
    '<div class="hrow"><div><div class="nm">'+esc(r.h.name)+'</div><div class="fq">'+r.f.label+
    (r.expect?' — '+r.got+' of '+r.expect:'')+'</div></div>'+
    '<div class="pct fig">'+(r.pct===null?r.got:r.pct+'%')+'</div>'+
    '<div class="track"><i style="width:'+(r.pct===null?0:r.pct)+'%"></i></div></div>').join('')
    :'<div class="empty"><h3>Nothing to measure yet</h3><p>Habit rates appear once you have some.</p></div>';
  return '<div class="cal-bar"><h2>'+MONTH[m]+' <i class="fig">'+y+'</i></h2><div class="stepper">'+
    '<button data-act="mon" data-d="-1" aria-label="Previous month">'+ICON.prev+'</button>'+
    '<button class="btn btn-quiet btn-sm" data-act="mon" data-d="0">Today</button>'+
    '<button data-act="mon" data-d="1" aria-label="Next month">'+ICON.next+'</button></div></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="l">Days logged</div><div class="v">'+logged+'<small> / '+len+'</small></div><div class="s">'+written+' with a note</div></div>'+
      '<div class="stat"><div class="l">Most common mood</div><div class="v" style="font-size:21px">'+topLabel+'</div><div class="mbar">'+bar+'</div></div>'+
      '<div class="stat"><div class="l">Sick days</div><div class="v">'+sickDays+'</div><div class="s">'+(sickDays?Math.round(sickDays/len*100)+'% of the month':'none')+'</div></div>'+
      '<div class="stat"><div class="l">Habits tracked</div><div class="v">'+rows.length+'</div><div class="s">'+rows.filter(r=>r.pct>=80).length+' at 80% or better</div></div>'+
    '</div>'+
    '<h2 style="font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 6px">Habit completion</h2>'+habitRows;
}

/* ══ day sheet: summary, then edit ════════ */
function openSheet(k){ S.sheetDate=k; S.editing=null; S.draft=null; $('#daySheet').classList.add('show'); drawSheet(); }
function closeSheet(){
  if(S.editing && draftDirty()){
    ask({title:'Throw away your changes?',body:'You have edits on this day that have not been saved.',
      yes:'Yes, discard',no:'Keep editing',danger:true,
      onYes(){ S.editing=null;S.draft=null;S.sheetDate=null;$('#daySheet').classList.remove('show');draw(); }});
    return;
  }
  S.editing=null; S.draft=null; S.sheetDate=null;
  $('#daySheet').classList.remove('show'); draw();
}

function summaryBody(k){
  const e=S.days[k]||{}, sk=sickOn(k);
  let html='';

  /* habits */
  const groups=liveGroups(), loose=liveHabits(null);
  const all=liveHabits();
  let done=0,relevant=0;
  for(const h of all){ const s=habitOn(h,k); if(s.done)done++; if(!s.before)relevant++; }
  const line=h=>{
    const s=habitOn(h,k);
    const mk=s.done?'<span class="mk y">✓</span>':s.missed?'<span class="mk n">✕</span>':'<span class="mk q">·</span>';
    return '<div class="sum-line">'+mk+'<span class="tx'+(s.done?'':' off')+'">'+esc(h.name)+'</span>'+
      (s.missed?'<span class="rt">'+s.over+'d over</span>':'')+'</div>';
  };
  html+='<div class="sum-sect"><div class="sum-h"><h3>Habits</h3>'+
    '<span class="meta">'+(all.length?done+' of '+all.length+' done':'none yet')+'</span></div>';
  if(!all.length) html+='<div class="sum-none">No habits set up.</div>';
  else{
    html+=loose.map(line).join('');
    for(const g of groups){
      const list=liveHabits(g.id); if(!list.length) continue;
      html+='<div class="sum-grp">'+esc(g.name)+'</div>'+list.map(line).join('');
    }
  }
  html+='</div>';

  /* mood */
  const mo=e.mood?mood(e.mood):null;
  html+='<div class="sum-sect"><div class="sum-h"><h3>Mood</h3></div>'+
    (mo?'<div class="sum-mood"><em>'+mo.em+'</em><span>'+mo.label+'</span></div>':'<div class="sum-none">Not recorded.</div>')+
    ((e.moodNote||'').trim()?'<div class="sum-quote">'+esc(e.moodNote)+'</div>':'')+
  '</div>';

  /* body */
  html+='<div class="sum-sect"><div class="sum-h"><h3>Body</h3></div>';
  if(!sk) html+='<div class="sum-none">Not recorded.</div>';
  else if(sk.status==='fine') html+='<div class="sum-tag fine">Fine</div>';
  else{
    const n=span(sk.startedOn,k)+1;
    html+='<div class="sum-tag sick">Sick'+(sk.illness?' — '+esc(sk.illness):'')+'</div>'+
      '<div class="meta" style="margin-top:6px;font-size:12px;color:var(--ink-dim)">'+
        (sk.explicit?'Day '+n:'Day '+n+', carried over from '+esc(pretty(sk.startedOn)))+'</div>'+
      ((sk.note||'').trim()?'<div class="sum-quote">'+esc(sk.note)+'</div>':'');
  }
  html+='</div>';

  /* event */
  html+='<div class="sum-sect"><div class="sum-h"><h3>Event</h3></div>'+
    ((e.event||'').trim()?'<div class="sum-quote">'+esc(e.event)+'</div>':'<div class="sum-none">Nothing written.</div>')+
  '</div>';

  html+='<div class="sum-actions">'+
    '<button class="btn btn-lamp" data-act="askedit" data-k="'+k+'">'+ICON.pencil+' Edit this day</button></div>';
  return html;
}

function promptBox(o){        // small form dialog: one text field
  askPending=null;
  $('#askBox').innerHTML='<div class="ask"><h3>'+esc(o.title)+'</h3>'+
    (o.body?'<p>'+esc(o.body)+'</p>':'')+
    '<label for="pbIn">'+esc(o.label||'Name')+'</label>'+
    '<input id="pbIn" maxlength="'+(o.max||50)+'" placeholder="'+esc(o.placeholder||'')+'" value="'+esc(o.value||'')+'" autocomplete="off">'+

  const inp=$('#pbIn');
  setTimeout(()=>{ try{ inp.focus(); }catch(_){} },60);
