<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0F13;
    --surface:#171923;
    --surface-2:#1E2130;
    --border:#262A36;
    --border-strong:#353B4D;
    --text:#E8E6E3;
    --muted:#8A8F9C;
    --dim:#5A6072;
    --gold:#D4A24C;
    --mint:#3FB984;
    --crimson:#C8384A;
    --rust:#B55A3E;
    --m-terrible:#6B2E3C;
    --m-okay:#5A6372;
    --m-alright:#4A7FA7;
    --m-good:#5F9E7F;
    --m-happy:#D4A24C;
    --radius:10px;
    --radius-sm:6px;
    --shadow:0 4px 20px rgba(0,0,0,.4);
    font-family:'Inter',system-ui,sans-serif;
    font-feature-settings:"cv11","ss01";
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);height:100%}
  body{font-size:14px;line-height:1.5;overflow:hidden}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
  input,textarea,select{font-family:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;outline:none;font-size:14px}
  input:focus,textarea:focus,select:focus{border-color:var(--gold)}
  textarea{resize:vertical;min-height:80px;line-height:1.6}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .serif{font-family:'Fraunces',Georgia,serif}

  /* layout */
  #app{display:grid;grid-template-rows:auto 1fr;height:100vh}
  header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:.3px}
  .brand span{color:var(--gold)}
  .nav{display:flex;gap:4px;margin-left:12px}
  .nav button{padding:6px 12px;border-radius:var(--radius-sm);color:var(--muted);font-weight:500}
  .nav button.active{background:var(--surface-2);color:var(--text)}
  .nav button:hover{color:var(--text)}
  .spacer{flex:1}
  .sync-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border)}
  .sync-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .sync-badge.synced .dot{background:var(--mint)}
  .sync-badge.saving .dot{background:var(--gold);animation:pulse 1s infinite}
  .sync-badge.offline .dot{background:var(--crimson)}
  .sync-badge.error .dot{background:var(--crimson)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .btn{padding:7px 14px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);font-weight:500;transition:background .15s}
  .btn:hover{background:var(--border)}
  .btn.primary{background:var(--gold);color:#1a1510;border-color:var(--gold)}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--crimson)}
  .icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--muted)}
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}

  main{overflow:auto;padding:20px 24px 60px}

  /* calendar */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
  .cal-title{font-family:'Fraunces',serif;font-size:26px;font-weight:500}
  .cal-nav{display:flex;gap:6px;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;text-align:center;padding:4px 0;font-weight:600}
  .day{min-height:110px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;cursor:pointer;display:flex;flex-direction:column;position:relative;transition:border-color .15s,transform .1s}
  .day:hover{border-color:var(--border-strong)}
  .day.other{opacity:.3}
  .day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .day .num{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:var(--text)}
  .day.today .num{color:var(--gold)}
  .day .face{font-size:22px;line-height:1;margin:2px 0}
  .day .sick-tag{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted)}
  .day .sick-tag.sick{color:var(--rust)}
  .day .sick-tag.fine{color:var(--mint);opacity:.7}
  .day .habit-dots{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap}
  .hdot{width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
  .hdot.done{background:var(--mint)}
  .hdot.missed{background:var(--crimson)}
  .day .event-dot{position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--m-alright)}

  /* day editor */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 20px}
  .overlay.open{display:flex}
  .sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:760px;padding:28px;box-shadow:var(--shadow);animation:rise .2s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sheet-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;gap:16px}
  .sheet-date{font-family:'Fraunces',serif;font-size:28px;font-weight:500}
  .sheet-date small{color:var(--muted);font-size:14px;font-weight:400;margin-left:10px;font-family:'Inter',sans-serif}
  .section{margin-bottom:28px}
  .section-title{text-transform:uppercase;font-size:11px;letter-spacing:1.6px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:10px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}

  /* habits */
  .habits-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:4px}
  .habit-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);position:relative;transition:background .1s}
  .habit-row:hover{background:rgba(255,255,255,.02)}
  .habit-row + .habit-row{border-top:1px solid var(--border)}
  .habit-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;background:var(--bg)}
  .habit-check:hover{border-color:var(--muted)}
  .habit-row.done .habit-check{background:var(--mint);border-color:var(--mint);color:#0a2a1a}
  .habit-row.done .habit-name{color:var(--mint)}
  .habit-row.missed{background:rgba(200,56,74,.08)}
  .habit-row.missed::before{content:'';position:absolute;inset:0;background:rgba(200,56,74,.1);border-radius:var(--radius-sm);pointer-events:none}
  .habit-name{flex:1;font-weight:500}
  .habit-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .habit-miss{font-size:11px;color:var(--crimson);font-weight:600;background:rgba(200,56,74,.15);padding:3px 8px;border-radius:4px}
  .habit-del{color:var(--dim);opacity:0;transition:opacity .15s}
  .habit-row:hover .habit-del{opacity:1}
  .habit-del:hover{color:var(--crimson)}
  .habits-footer{padding:12px;border-top:1px solid var(--border);margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .miss-summary{color:var(--crimson);font-size:12px;font-weight:600}
  .miss-summary.none{color:var(--muted);font-weight:400}
  .add-habit-form{display:flex;gap:8px;flex:1;min-width:280px}
  .add-habit-form input{flex:1}

  /* mood */
  .mood-row{display:flex;gap:8px;flex-wrap:wrap}
  .mood-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px;border-radius:var(--radius);background:var(--surface-2);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;min-width:80px}
  .mood-btn:hover{border-color:var(--border-strong)}
  .mood-btn .emoji{font-size:28px;line-height:1}
  .mood-btn .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
  .mood-btn.active{background:var(--bg)}
  .mood-btn.active[data-mood=terrible]{border-color:var(--m-terrible);box-shadow:0 0 14px -4px var(--m-terrible)}
  .mood-btn.active[data-mood=okay]{border-color:var(--m-okay);box-shadow:0 0 14px -4px var(--m-okay)}
  .mood-btn.active[data-mood=alright]{border-color:var(--m-alright);box-shadow:0 0 14px -4px var(--m-alright)}
  .mood-btn.active[data-mood=good]{border-color:var(--m-good);box-shadow:0 0 14px -4px var(--m-good)}
  .mood-btn.active[data-mood=happy]{border-color:var(--m-happy);box-shadow:0 0 14px -4px var(--m-happy)}
  .mood-btn.active .label{color:var(--text)}

  /* health */
  .health-toggle{display:flex;gap:6px;margin-bottom:12px}
  .health-toggle button{padding:8px 18px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);font-weight:600;letter-spacing:.5px;font-size:12px;text-transform:uppercase;color:var(--muted)}
  .health-toggle button.active.fine{background:var(--mint);color:#0a2a1a;border-color:var(--mint)}
  .health-toggle button.active.sick{background:var(--rust);color:#2a1510;border-color:var(--rust)}
  .health-toggle button.carrying{border-style:dashed;color:var(--rust);font-weight:500}
  .health-toggle button.carrying::after{content:' (carrying)';opacity:.6;font-size:10px}
  .sick-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
  .illness-chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:16px;font-size:12px;cursor:pointer;transition:all .1s}
  .chip:hover{border-color:var(--border-strong)}
  .chip.active{background:var(--rust);border-color:var(--rust);color:#fff}
  .sick-note{min-height:60px}

  /* event */
  .event-note{width:100%;min-height:120px;font-family:'Fraunces',Georgia,serif;font-size:16px;line-height:1.6;padding:14px 16px}

  /* heatmap */
  .heatmap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow-x:auto}
  .heatmap-title{font-family:'Fraunces',serif;font-size:22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline}
  .heatmap-year{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:16px}
  .heat-grid{display:grid;grid-template-columns:auto 1fr;gap:6px;min-width:800px}
  .heat-months{display:grid;grid-template-columns:repeat(53,1fr);gap:3px;font-size:10px;color:var(--muted);margin-left:28px}
  .heat-rows{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
  .heat-dow-labels{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);align-items:center;padding-right:4px}
  .heat-cells{display:grid;grid-template-columns:repeat(53,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
  .heat-cell{width:12px;height:12px;border-radius:2px;background:var(--surface-2);cursor:pointer}
  .heat-cell[data-mood=terrible]{background:var(--m-terrible)}
  .heat-cell[data-mood=okay]{background:var(--m-okay)}
  .heat-cell[data-mood=alright]{background:var(--m-alright)}
  .heat-cell[data-mood=good]{background:var(--m-good)}
  .heat-cell[data-mood=happy]{background:var(--m-happy)}
  .heat-cell.sick{outline:1.5px solid var(--rust);outline-offset:-1px}
  .heat-cell:hover{outline:1.5px solid var(--gold);outline-offset:1px}
  .heat-legend{display:flex;align-items:center;gap:16px;margin-top:16px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .heat-legend .items{display:flex;gap:8px;align-items:center}
  .heat-legend .swatch{width:12px;height:12px;border-radius:2px;display:inline-block}

  /* summary */
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .stat .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:600;margin-bottom:8px}
  .stat .value{font-family:'Fraunces',serif;font-size:30px;font-weight:500;line-height:1}
  .stat .sub{color:var(--muted);font-size:12px;margin-top:4px;font-family:'JetBrains Mono',monospace}
  .mood-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;background:var(--surface-2)}
  .mood-bar div{height:100%}
  .habit-stats{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px}
  .habit-stats h3{font-family:'Fraunces',serif;font-size:18px;margin:0 0 14px;font-weight:500}
  .habit-stat-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
  .habit-stat-row:first-child{border-top:none}
  .habit-bar{width:140px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;grid-column:2}
  .habit-bar div{height:100%;background:var(--mint)}

  /* auth */
  .auth-wall{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;max-width:460px;margin:40px auto;background:var(--surface);border:1px solid var(--border);border-radius:14px}
  .auth-wall h2{font-family:'Fraunces',serif;font-size:28px;margin:0 0 8px}
  .auth-wall p{color:var(--muted);margin:0 0 24px;line-height:1.6}
  .auth-wall .btn.primary{padding:12px 24px;font-size:15px}
  .local-notice{color:var(--muted);font-size:12px;margin-top:14px}

  /* toasts */
  .toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
  .toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:13px;box-shadow:var(--shadow);min-width:220px;animation:slide .2s}
  .toast.error{border-color:var(--crimson)}
  .toast.success{border-color:var(--mint)}
  @keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

  /* settings menu */
  .menu{position:absolute;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px;min-width:200px;z-index:50;display:none}
  .menu.open{display:block}
  .menu button{display:flex;width:100%;padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;text-align:left;align-items:center;gap:10px}
  .menu button:hover{background:var(--surface-2)}
  .menu .divider{height:1px;background:var(--border);margin:4px 0}
  .menu .email{padding:9px 12px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;word-break:break-all}

  /* freq select */
  .freq-select{padding:4px 6px;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'JetBrains Mono',monospace;cursor:pointer}

  .freq-badge{font-size:10px;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;border:1px solid var(--border)}

  /* responsive */
  @media (max-width:720px){
    .day{min-height:72px;padding:5px}
    .day .face{font-size:16px}
    .day .num{font-size:12px}
    main{padding:12px}
    .sheet{padding:18px}
    .cal-title{font-size:20px}
    header.top{padding:10px 12px;flex-wrap:wrap}
    .nav{order:3;width:100%;justify-content:center}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Jour<span>·</span>nal</div>
    <nav class="nav" id="nav">
      <button data-view="calendar" class="active">Calendar</button>
      <button data-view="heatmap">Heatmap</button>
      <button data-view="summary">Summary</button>
    </nav>
    <div class="spacer"></div>
    <div id="syncBadge" class="sync-badge offline"><span class="dot"></span><span id="syncText">Local</span></div>
    <div style="position:relative">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">⋯</button>
      <div class="menu" id="menu">
        <div class="email" id="userEmail">Not signed in</div>
        <div class="divider"></div>
        <button data-action="signin" id="signinBtn">Sign in to Google</button>
        <button data-action="signout" id="signoutBtn" style="display:none">Sign out</button>
        <div class="divider"></div>
        <button data-action="sync">Sync now</button>
        <button data-action="export">Export JSON</button>
        <button data-action="import">Import JSON</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  // Google OAuth Client ID. For deployment, add your GitHub Pages
  // URL to the client's "Authorized JavaScript origins".
  // Scope used: drive.file (sees only files it creates or opens).
  GOOGLE_CLIENT_ID: '985235699107-02f7jek8uvp57o5oissq94ms85ujphf8.apps.googleusercontent.com',
  DRIVE_FILE_NAME: 'diary-data.json',
  DRIVE_FOLDER_NAME: 'Diary',
  SCHEMA_VERSION: 1,
  AUTOSAVE_DEBOUNCE_MS: 2500,
  POLL_INTERVAL_MS: 60000
};

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const uid = () => 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
const todayKey = () => dateKey(new Date());
function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ // whole days, b-a
  const ms = parseKey(b).getTime() - parseKey(a).getTime();
  return Math.round(ms/86400000);
}
function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 3200);
}

const FREQUENCIES = [
  {id:'daily', label:'Every day', days:1},
  {id:'every2', label:'Every 2 days', days:2},
  {id:'every3', label:'Every 3 days', days:3},
  {id:'every4', label:'Every 4 days', days:4},
  {id:'every5', label:'Every 5 days', days:5},
  {id:'every6', label:'Every 6 days', days:6},
  {id:'every7', label:'Weekly', days:7},
  {id:'biweekly', label:'Every 2 weeks', days:14},
  {id:'triweekly', label:'Every 3 weeks', days:21},
  {id:'monthly', label:'Monthly', days:30},
  {id:'whenever', label:'Whenever', days:null}
];
const freqById = id => FREQUENCIES.find(f=>f.id===id) || FREQUENCIES[0];

const MOODS = [
  {id:'terrible', emoji:'😣', label:'Terrible', color:'var(--m-terrible)'},
  {id:'okay',     emoji:'😐', label:'Okay',     color:'var(--m-okay)'},
  {id:'alright',  emoji:'🙂', label:'Alright',  color:'var(--m-alright)'},
  {id:'good',     emoji:'😊', label:'Good',     color:'var(--m-good)'},
  {id:'happy',    emoji:'😄', label:'Happy',    color:'var(--m-happy)'}
];
const moodById = id => MOODS.find(m=>m.id===id);

const COMMON_ILLNESSES = ['Cold','Flu','Strep throat','Stomach bug','Migraine','Fever','Headache'];

/* ============================================================
   STATE
   ============================================================ */
const State = {
  schemaVersion: CONFIG.SCHEMA_VERSION,
  deviceId: null,
  habits: {},         // id -> {id,name,frequency,createdAt,deletedAt,updatedAt,order}
  days: {},           // "YYYY-MM-DD" -> {habits:{hid:{done,doneAt}}, event, mood, sick:{status,illness,note}, updatedAt}
  view: 'calendar',
  cursor: new Date(), // month cursor
  editingDay: null,
  _lastKnownRemoteUpdatedAt: null,
  _driveFileId: null,
  _signedIn: false,
  _userEmail: null,
  _tokenClient: null,
  _accessToken: null,
  _tokenExpiresAt: 0,
  _saveTimer: null,
  _dirty: false
};

/* ============================================================
   INDEXEDDB (local store)
   ============================================================ */
const DB_NAME = 'journal-db';
const DB_VER = 1;
let dbPromise = null;
function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function dbGet(key){
  const db = await openDB();
  return new Promise((res, rej)=>{
    const tx = db.transaction('kv','readonly').objectStore('kv').get(key);
    tx.onsuccess = ()=> res(tx.result);
    tx.onerror = ()=> rej(tx.error);
  });
}
async function dbSet(key, val){
  const db = await openDB();
  return new Promise((res, rej)=>{
    const tx = db.transaction('kv','readwrite').objectStore('kv').put(val, key);
    tx.onsuccess = ()=> res();
    tx.onerror = ()=> rej(tx.error);
  });
}

async function loadLocal(){
  const stored = await dbGet('state');
  if (stored){
    Object.assign(State, {
      schemaVersion: stored.schemaVersion || CONFIG.SCHEMA_VERSION,
      deviceId: stored.deviceId,
      habits: stored.habits || {},
      days: stored.days || {},
      _driveFileId: stored._driveFileId || null,
      _lastKnownRemoteUpdatedAt: stored._lastKnownRemoteUpdatedAt || null
    });
  }
  if (!State.deviceId){
    State.deviceId = uid();
    await persistLocal();
  }
}
async function persistLocal(){
  await dbSet('state', {
    schemaVersion: State.schemaVersion,
    deviceId: State.deviceId,
    habits: State.habits,
    days: State.days,
    _driveFileId: State._driveFileId,
    _lastKnownRemoteUpdatedAt: State._lastKnownRemoteUpdatedAt
  });
}

/* ============================================================
   DATA MUTATIONS (each stamps updatedAt)
   ============================================================ */
function getDay(key){
  return State.days[key] || null;
}
function ensureDay(key){
  if (!State.days[key]){
    State.days[key] = { date:key, habits:{}, event:'', mood:null, sick:null, updatedAt:nowISO() };
  }
  return State.days[key];
}
function touchDay(key){
  const d = ensureDay(key);
  d.updatedAt = nowISO();
  markDirty();
}
function setHabitDone(dateKey_, habitId, done){
  const d = ensureDay(dateKey_);
  if (!d.habits) d.habits = {};
  if (done){
    d.habits[habitId] = { done:true, doneAt:nowISO() };
  } else {
    delete d.habits[habitId];
  }
  touchDay(dateKey_);
}
function setEvent(dateKey_, text){
  const d = ensureDay(dateKey_);
  d.event = text;
  touchDay(dateKey_);
}
function setMood(dateKey_, moodId){
  const d = ensureDay(dateKey_);
  d.mood = moodId;
  touchDay(dateKey_);
}
function setSick(dateKey_, patch){
  const d = ensureDay(dateKey_);
  d.sick = patch;
  touchDay(dateKey_);
}

function createHabit(name, freqId){
  const id = uid();
  const maxOrder = Object.values(State.habits).reduce((m,h)=>Math.max(m, h.order||0), 0);
  State.habits[id] = {
    id, name:name.trim(), frequency:freqId,
    createdAt: todayKey(),
    deletedAt: null,
    order: maxOrder + 1,
    updatedAt: nowISO()
  };
  markDirty();
  return id;
}
function updateHabit(id, patch){
  if (!State.habits[id]) return;
  Object.assign(State.habits[id], patch, { updatedAt: nowISO() });
  markDirty();
}
function deleteHabit(id){
  if (!State.habits[id]) return;
  State.habits[id].deletedAt = nowISO();
  State.habits[id].updatedAt = nowISO();
  markDirty();
}

function markDirty(){
  State._dirty = true;
  persistLocal();
  scheduleSave();
}

/* ============================================================
   SICK CARRY LOGIC
   For a date, walk backward to find the last explicit sick/fine entry.
   If "sick" and nothing has flipped to "fine" since, this day is sick.
   ============================================================ */
function effectiveSick(dateKey_){
  const own = State.days[dateKey_]?.sick;
  if (own) return { ...own, _explicit:true };
  // walk backward
  const keys = Object.keys(State.days).filter(k => k < dateKey_ && State.days[k].sick).sort();
  if (!keys.length) return null;
  const latestKey = keys[keys.length-1];
  const latest = State.days[latestKey].sick;
  if (latest.status === 'sick'){
    return { ...latest, _explicit:false, _carriedFrom:latestKey };
  }
  return null;
}

/* ============================================================
   HABIT STATE (per habit per date)
   Returns {done, missed, daysSinceLastDone, isDueOnOrBefore(date)}
   ============================================================ */
function habitStatusOn(habit, dateKey_){
  const freq = freqById(habit.frequency);
  const dayEntry = State.days[dateKey_];
  const done = !!dayEntry?.habits?.[habit.id]?.done;

  if (freq.days === null){
    // whenever — never missed
    return { done, missed:false, missDays:0 };
  }
  if (dateKey_ < habit.createdAt){
    return { done:false, missed:false, missDays:0 };
  }

  // Find last done date on or before this date
  let lastDone = null;
  for (const k of Object.keys(State.days)){
    if (k <= dateKey_ && State.days[k]?.habits?.[habit.id]?.done){
      if (!lastDone || k > lastDone) lastDone = k;
    }
  }

  // Reference for "when was it last expected to be done"
  // If never done, baseline = createdAt; else = lastDone
  const baseline = lastDone || habit.createdAt;
  const gap = daysBetween(baseline, dateKey_);

  if (done){
    return { done:true, missed:false, missDays:0, lastDone };
  }
  // Due day = baseline + freq.days. Missed if dateKey_ > that.
  // missDays = number of full freq-cycles overdue (user said "how many days missed")
  // We'll report whole days overdue past the due date.
  const overdue = gap - freq.days;
  if (overdue > 0){
    return { done:false, missed:true, missDays:overdue, lastDone };
  }
  return { done:false, missed:false, missDays:0, lastDone };
}

/* ============================================================
   GOOGLE AUTH + DRIVE
   ============================================================ */
let gisReady = false;
function loadGIS(){
  return new Promise((resolve, reject)=>{
    if (window.google?.accounts?.oauth2){ gisReady = true; return resolve(); }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = ()=>{ gisReady = true; resolve(); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initAuth(){
  await loadGIS();
  State._tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
    callback: async (resp) => {
      if (resp.error){
        setSyncStatus('error', 'Auth error');
        toast('Sign-in failed: ' + resp.error, 'error');
        return;
      }
      State._accessToken = resp.access_token;
      State._tokenExpiresAt = Date.now() + (resp.expires_in - 60) * 1000;
      State._signedIn = true;
      await fetchUserInfo();
      renderMenu();
      await initialSync();
    }
  });
  // Try silent reauth if we have a stored hint
  const hint = await dbGet('authHint');
  if (hint){
    requestToken({prompt:''});
  }
}

function requestToken(opts={}){
  if (!State._tokenClient) return;
  State._tokenClient.requestAccessToken(opts);
}

async function ensureToken(){
  if (State._accessToken && Date.now() < State._tokenExpiresAt) return State._accessToken;
  return new Promise((resolve, reject)=>{
    const orig = State._tokenClient.callback;
    State._tokenClient.callback = async (resp) => {
      State._tokenClient.callback = orig;
      if (resp.error){ reject(resp); return; }
      State._accessToken = resp.access_token;
      State._tokenExpiresAt = Date.now() + (resp.expires_in - 60) * 1000;
      resolve(resp.access_token);
    };
    State._tokenClient.requestAccessToken({prompt:''});
  });
}

async function fetchUserInfo(){
  try {
    const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
      headers: { Authorization: 'Bearer ' + State._accessToken }
    });
    if (r.ok){
      const j = await r.json();
      State._userEmail = j.email;
      await dbSet('authHint', j.email);
    }
  } catch(e){ /* ignore */ }
}

async function driveFetch(path, opts={}){
  const token = await ensureToken();
  const r = await fetch('https://www.googleapis.com/' + path, {
    ...opts,
    headers: {
      ...(opts.headers||{}),
      Authorization: 'Bearer ' + token
    }
  });
  if (!r.ok){
    const err = await r.text();
    throw new Error(`Drive ${r.status}: ${err}`);
  }
  return r;
}

async function findOrCreateFolder(){
  const q = encodeURIComponent(`name='${CONFIG.DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await driveFetch(`drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const j = await r.json();
  if (j.files && j.files.length) return j.files[0].id;
  // create
  const c = await driveFetch('drive/v3/files', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name:CONFIG.DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' })
  });
  const cj = await c.json();
  return cj.id;
}

async function findDataFile(){
  if (State._driveFileId){
    // verify it still exists
    try {
      const r = await driveFetch(`drive/v3/files/${State._driveFileId}?fields=id,name,modifiedTime,trashed`);
      const j = await r.json();
      if (!j.trashed) return j;
    } catch(e){
      State._driveFileId = null;
    }
  }
  const q = encodeURIComponent(`name='${CONFIG.DRIVE_FILE_NAME}' and trashed=false`);
  const r = await driveFetch(`drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`);
  const j = await r.json();
  if (j.files && j.files.length){
    State._driveFileId = j.files[0].id;
    await persistLocal();
    return j.files[0];
  }
  return null;
}

async function createDataFile(){
  const folderId = await findOrCreateFolder();
  const meta = {
    name: CONFIG.DRIVE_FILE_NAME,
    parents: [folderId],
    mimeType: 'application/json'
  };
  const body = buildExportObject();
  const boundary = 'bndry' + Date.now();
  const multipart =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(body)}\r\n--${boundary}--`;
  const r = await driveFetch('upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
    method:'POST',
    headers:{'Content-Type':`multipart/related; boundary=${boundary}`},
    body: multipart
  });
  const j = await r.json();
  State._driveFileId = j.id;
  State._lastKnownRemoteUpdatedAt = body.updatedAt;
  await persistLocal();
  return j;
}

async function downloadDataFile(){
  if (!State._driveFileId) return null;
  const r = await driveFetch(`drive/v3/files/${State._driveFileId}?alt=media`);
  return await r.json();
}

async function uploadDataFile(){
  if (!State._driveFileId){
    await createDataFile();
    return;
  }
  const body = buildExportObject();
  const r = await driveFetch(`upload/drive/v3/files/${State._driveFileId}?uploadType=media&fields=id,modifiedTime`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  State._lastKnownRemoteUpdatedAt = body.updatedAt;
  await persistLocal();
  return j;
}

function buildExportObject(){
  return {
    schemaVersion: CONFIG.SCHEMA_VERSION,
    updatedAt: nowISO(),
    deviceId: State.deviceId,
    habits: State.habits,
    days: State.days
  };
}

/* ============================================================
   MERGE: last-write-wins per habit, per day
   ============================================================ */
function mergeRemote(remote){
  if (!remote) return false;
  let changed = false;

  // Habits — merge per habit
  const rh = remote.habits || {};
  for (const id of Object.keys(rh)){
    const r = rh[id];
    const l = State.habits[id];
    if (!l || new Date(r.updatedAt) > new Date(l.updatedAt)){
      State.habits[id] = r;
      changed = true;
    }
  }
  // keep local-only habits (already there)

  // Days — merge per day (whole-day latest wins; simpler + correct for small payloads)
  const rd = remote.days || {};
  for (const key of Object.keys(rd)){
    const r = rd[key];
    const l = State.days[key];
    if (!l || new Date(r.updatedAt) > new Date(l.updatedAt)){
      State.days[key] = r;
      changed = true;
    }
  }

  return changed;
}

/* ============================================================
   SYNC ORCHESTRATION
   ============================================================ */
let syncInFlight = false;
async function initialSync(){
  if (!State._signedIn) return;
  setSyncStatus('saving','Syncing');
  try {
    const file = await findDataFile();
    if (!file){
      await createDataFile();
      setSyncStatus('synced','Synced');
      renderCurrentView();
      return;
    }
    const remote = await downloadDataFile();
    const changed = mergeRemote(remote);
    if (changed){
      await persistLocal();
      renderCurrentView();
    }
    State._lastKnownRemoteUpdatedAt = remote.updatedAt;
    // If local has newer data than remote (dirty since boot), push
    if (State._dirty){
      await uploadDataFile();
    }
    await persistLocal();
    setSyncStatus('synced','Synced');
  } catch(e){
    console.error(e);
    setSyncStatus('error','Sync failed');
    toast('Sync failed: ' + e.message, 'error');
  }
}

async function syncNow(){
  if (!State._signedIn){ toast('Sign in to sync'); return; }
  if (syncInFlight) return;
  syncInFlight = true;
  setSyncStatus('saving','Syncing');
  try {
    // Fetch remote first, merge, then push if dirty or merged changes
    const file = await findDataFile();
    if (!file){
      await createDataFile();
    } else {
      const remote = await downloadDataFile();
      const remoteNewer = !State._lastKnownRemoteUpdatedAt || new Date(remote.updatedAt) > new Date(State._lastKnownRemoteUpdatedAt);
      let changed = false;
      if (remoteNewer) changed = mergeRemote(remote);
      if (changed){ await persistLocal(); renderCurrentView(); }
      State._lastKnownRemoteUpdatedAt = remote.updatedAt;
      // push: always push our view to make sure remote has latest merged state
      await uploadDataFile();
    }
    State._dirty = false;
    await persistLocal();
    setSyncStatus('synced','Synced');
  } catch(e){
    console.error(e);
    setSyncStatus('error','Sync failed');
    toast('Sync failed: ' + e.message, 'error');
  } finally {
    syncInFlight = false;
  }
}

function scheduleSave(){
  if (!State._signedIn) return;
  clearTimeout(State._saveTimer);
  State._saveTimer = setTimeout(()=>{ syncNow(); }, CONFIG.AUTOSAVE_DEBOUNCE_MS);
}

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function renderCalendar(){
  const cur = State.cursor;
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y,m,1);
  const firstDow = (first.getDay()+6)%7; // make Monday=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDaysInMonth = new Date(y,m,0).getDate();

  let html = `
    <div class="cal-header">
      <div class="cal-title">${MONTHS[m]} <span style="color:var(--muted);font-weight:400">${y}</span></div>
      <div class="cal-nav">
        <button class="btn ghost" data-cal="today">Today</button>
        <button class="icon-btn" data-cal="prev" aria-label="Previous month">‹</button>
        <button class="icon-btn" data-cal="next" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="grid">`;
  for (const d of DOW) html += `<div class="dow">${d}</div>`;

  const today = todayKey();
  const cells = 42;
  for (let i=0;i<cells;i++){
    let dayNum, monthOffset;
    if (i < firstDow){
      dayNum = prevDaysInMonth - firstDow + 1 + i;
      monthOffset = -1;
    } else if (i >= firstDow + daysInMonth){
      dayNum = i - firstDow - daysInMonth + 1;
      monthOffset = 1;
    } else {
      dayNum = i - firstDow + 1;
      monthOffset = 0;
    }
    const cellDate = new Date(y, m + monthOffset, dayNum);
    const key = dateKey(cellDate);
    const isOther = monthOffset !== 0;
    const isToday = key === today;
    const entry = State.days[key];
    const sick = effectiveSick(key);
    const mood = entry?.mood ? moodById(entry.mood) : null;

    const activeHabits = Object.values(State.habits).filter(h => !h.deletedAt && key >= h.createdAt);
    const dots = activeHabits.slice(0,10).map(h=>{
      const st = habitStatusOn(h, key);
      if (st.done) return '<span class="hdot done"></span>';
      if (st.missed) return '<span class="hdot missed"></span>';
      return '<span class="hdot"></span>';
    }).join('');
    const eventDot = (entry?.event && entry.event.trim()) ? '<span class="event-dot" title="Event note"></span>' : '';
    const sickTag = sick ? (sick.status==='sick'
      ? `<div class="sick-tag sick">SICK</div>`
      : '') : '';

    html += `
      <div class="day ${isOther?'other':''} ${isToday?'today':''}" data-day="${key}">
        <div class="num">${dayNum}</div>
        ${mood ? `<div class="face">${mood.emoji}</div>` : ''}
        ${sickTag}
        <div class="habit-dots">${dots}</div>
        ${eventDot}
      </div>`;
  }
  html += `</div>`;
  return html;
}

function renderHeatmap(){
  const now = new Date();
  const year = State.cursor.getFullYear();
  const start = new Date(year,0,1);
  const end = new Date(year,11,31);

  // Build 53 weeks x 7 days grid starting from Monday of the first week
  const startDow = (start.getDay()+6)%7;
  const gridStart = addDays(start, -startDow);

  const cells = [];
  const monthLabels = Array(53).fill('');
  let d = new Date(gridStart);
  for (let w=0; w<53; w++){
    for (let r=0; r<7; r++){
      const key = dateKey(d);
      const inYear = d.getFullYear() === year;
      cells.push({ key, inYear, w, r,
        mood: State.days[key]?.mood || null,
        sick: effectiveSick(key)?.status === 'sick'
      });
      if (r===0 && inYear && d.getDate() <= 7){
        monthLabels[w] = MONTHS[d.getMonth()].slice(0,3);
      }
      d = addDays(d, 1);
    }
  }

  let labelRow = '';
  for (let w=0; w<53; w++) labelRow += `<div>${monthLabels[w]||''}</div>`;

  let cellHtml = '';
  for (const c of cells){
    cellHtml += `<div class="heat-cell ${c.sick?'sick':''}" data-day="${c.key}"
                   ${c.mood?`data-mood="${c.mood}"`:''}
                   style="${c.inYear?'':'opacity:.15'}"
                   title="${c.key}${c.mood?' · '+c.mood:''}${c.sick?' · sick':''}"></div>`;
  }

  const dowLabels = ['','Tue','','Thu','','Sat',''].map(l=>`<div>${l}</div>`).join('');

  const legend = MOODS.map(m => `<span class="items"><span class="swatch" style="background:${m.color}"></span>${m.label}</span>`).join('');

  return `
    <div class="heatmap">
      <div class="heatmap-title">
        <span>Year</span>
        <span class="heat-grid-nav">
          <button class="btn ghost" data-heat="prev">‹</button>
          <span class="heat-year">${year}</span>
          <button class="btn ghost" data-heat="next">›</button>
        </span>
      </div>
      <div class="heat-grid">
        <div class="heat-dow-labels">${dowLabels}</div>
        <div>
          <div class="heat-months">${labelRow}</div>
          <div class="heat-cells">${cellHtml}</div>
        </div>
      </div>
      <div class="heat-legend">
        <span>Mood:</span>${legend}
        <span style="margin-left:16px">·</span>
        <span class="items"><span class="swatch" style="background:var(--surface-2);outline:1.5px solid var(--rust);outline-offset:-1px"></span>Sick day</span>
      </div>
    </div>
  `;
}

function renderSummary(){
  const cur = State.cursor;
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const total = last.getDate();

  const moodCounts = {terrible:0, okay:0, alright:0, good:0, happy:0};
  let logged = 0, sickDays = 0, eventDays = 0;

  for (let i=1;i<=total;i++){
    const key = dateKey(new Date(y,m,i));
    const entry = State.days[key];
    if (entry?.mood){ moodCounts[entry.mood]++; logged++; }
    if (effectiveSick(key)?.status === 'sick') sickDays++;
    if (entry?.event && entry.event.trim()) eventDays++;
  }

  const moodBarSegs = MOODS.map(m=>{
    const pct = logged ? (moodCounts[m.id]/logged*100) : 0;
    return pct ? `<div style="width:${pct}%;background:${m.color}" title="${m.label} ${moodCounts[m.id]}"></div>` : '';
  }).join('');

  // habit completion rates for month
  const activeHabits = Object.values(State.habits).filter(h=>!h.deletedAt);
  const habitStats = activeHabits.map(h=>{
    const freq = freqById(h.frequency);
    let expected = 0, done = 0;
    for (let i=1;i<=total;i++){
      const key = dateKey(new Date(y,m,i));
      if (key < h.createdAt) continue;
      if (freq.days !== null){
        const gap = daysBetween(h.createdAt, key);
        if (gap % freq.days === 0) expected++;
      }
      if (State.days[key]?.habits?.[h.id]?.done) done++;
    }
    const pct = expected ? Math.round(done/expected*100) : (freq.days===null ? 100 : 0);
    return { ...h, done, expected, pct };
  }).sort((a,b)=>b.pct-a.pct);

  const topMood = Object.entries(moodCounts).sort((a,b)=>b[1]-a[1])[0];
  const topMoodName = topMood && topMood[1] ? moodById(topMood[0]).label : '—';

  return `
    <div class="cal-header">
      <div class="cal-title">${MONTHS[m]} <span style="color:var(--muted);font-weight:400">${y}</span></div>
      <div class="cal-nav">
        <button class="btn ghost" data-cal="today">This month</button>
        <button class="icon-btn" data-cal="prev">‹</button>
        <button class="icon-btn" data-cal="next">›</button>
      </div>
    </div>
    <div class="summary-grid">
      <div class="stat">
        <div class="label">Days logged</div>
        <div class="value">${logged}<span style="color:var(--muted);font-size:16px"> / ${total}</span></div>
        <div class="sub">${eventDays} with note</div>
      </div>
      <div class="stat">
        <div class="label">Top mood</div>
        <div class="value">${topMoodName}</div>
        <div class="mood-bar">${moodBarSegs}</div>
      </div>
      <div class="stat">
        <div class="label">Sick days</div>
        <div class="value">${sickDays}</div>
        <div class="sub">${sickDays ? Math.round(sickDays/total*100)+'%' : 'none this month'}</div>
      </div>
      <div class="stat">
        <div class="label">Habits tracked</div>
        <div class="value">${activeHabits.length}</div>
        <div class="sub">${habitStats.filter(h=>h.pct>=80).length} ≥80% done</div>
      </div>
    </div>
    <div class="habit-stats">
      <h3>Habit completion</h3>
      ${habitStats.length ? habitStats.map(h=>`
        <div class="habit-stat-row">
          <div><strong>${escapeHtml(h.name)}</strong> <span class="freq-badge" style="margin-left:6px">${freqById(h.frequency).label}</span></div>
          <div class="habit-bar"><div style="width:${h.pct}%"></div></div>
          <div class="mono" style="color:var(--muted);min-width:70px;text-align:right">${h.done}/${h.expected||'∞'} · ${h.pct}%</div>
        </div>
      `).join('') : '<div style="color:var(--muted);padding:12px 0">No habits yet. Open any day and add one.</div>'}
    </div>
  `;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   DAY EDITOR
   ============================================================ */
function openDayEditor(key){
  State.editingDay = key;
  const ov = $('#overlay'); ov.classList.add('open');
  renderDayEditor();
}
function closeDayEditor(){
  State.editingDay = null;
  $('#overlay').classList.remove('open');
  renderCurrentView();
}
function renderDayEditor(){
  const key = State.editingDay; if (!key) return;
  const entry = ensureDay(key);
  const d = parseKey(key);
  const sick = effectiveSick(key);
  const activeHabits = Object.values(State.habits)
    .filter(h => !h.deletedAt && key >= h.createdAt)
    .sort((a,b)=>(a.order||0)-(b.order||0));

  let habitRows = '';
  let totalMissed = 0;
  for (const h of activeHabits){
    const st = habitStatusOn(h, key);
    if (st.missed) totalMissed++;
    const cls = st.done ? 'done' : (st.missed ? 'missed' : '');
    const freq = freqById(h.frequency);
    habitRows += `
      <div class="habit-row ${cls}" data-habit="${h.id}">
        <div class="habit-check" data-habit-toggle="${h.id}">${st.done?'✓':''}</div>
        <div class="habit-name">${escapeHtml(h.name)}</div>
        ${st.missed ? `<div class="habit-miss">${st.missDays}d missed</div>` : ''}
        <select class="freq-select" data-habit-freq="${h.id}">
          ${FREQUENCIES.map(f=>`<option value="${f.id}" ${f.id===h.frequency?'selected':''}>${f.label}</option>`).join('')}
        </select>
        <button class="icon-btn habit-del" data-habit-del="${h.id}" title="Delete habit">×</button>
      </div>`;
  }
  if (!activeHabits.length){
    habitRows = `<div style="padding:14px;color:var(--muted);text-align:center">No habits yet. Add one below.</div>`;
  }

  const moodBtns = MOODS.map(m => `
    <button class="mood-btn ${entry.mood===m.id?'active':''}" data-mood="${m.id}">
      <span class="emoji">${m.emoji}</span>
      <span class="label">${m.label}</span>
    </button>
  `).join('');

  // Sick panel
  const explicitSick = entry.sick;
  const effectiveStatus = explicitSick ? explicitSick.status : (sick?.status || null);
  const showSickPanel = effectiveStatus === 'sick';
  const activeIllness = explicitSick?.illness || sick?.illness || null;
  const activeNote = explicitSick?.note || sick?.note || '';

  const chips = COMMON_ILLNESSES.map(name => `
    <div class="chip ${activeIllness===name?'active':''}" data-illness="${escapeHtml(name)}">${name}</div>
  `).join('');
  const customActive = activeIllness && !COMMON_ILLNESSES.includes(activeIllness);

  const carrying = sick && !explicitSick;

  const weekday = d.toLocaleDateString(undefined, {weekday:'long'});
  const monthLabel = d.toLocaleDateString(undefined, {month:'long', day:'numeric', year:'numeric'});

  $('#sheet').innerHTML = `
    <div class="sheet-head">
      <div class="sheet-date">${weekday}<small>${monthLabel}</small></div>
      <button class="icon-btn" id="closeSheet">✕</button>
    </div>

    <div class="section">
      <div class="section-title">Habits</div>
      <div class="habits-box">
        ${habitRows}
        <div class="habits-footer">
          <div class="miss-summary ${totalMissed?'':'none'}">
            ${totalMissed ? `⚠ ${totalMissed} habit${totalMissed>1?'s':''} missed today` : 'All on track'}
          </div>
          <form class="add-habit-form" id="addHabitForm">
            <input type="text" id="newHabitName" placeholder="New habit…" maxlength="60"/>
            <select id="newHabitFreq">
              ${FREQUENCIES.map(f=>`<option value="${f.id}" ${f.id==='daily'?'selected':''}>${f.label}</option>`).join('')}
            </select>
            <button type="submit" class="btn primary">Add</button>
          </form>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Mood</div>
      <div class="mood-row">${moodBtns}</div>
    </div>

    <div class="section">
      <div class="section-title">Health</div>
      <div class="health-toggle">
        <button class="${effectiveStatus==='fine'?'active fine':''}" data-sick="fine">FINE</button>
        <button class="${effectiveStatus==='sick'?'active sick':''} ${carrying?'carrying':''}" data-sick="sick">SICK</button>
        ${entry.sick ? '<button class="btn ghost" data-sick="clear" style="margin-left:auto">Clear</button>':''}
      </div>
      ${showSickPanel ? `
        <div class="sick-panel">
          <div>
            <div class="section-title" style="margin:0 0 8px">Illness</div>
            <div class="illness-chips">
              ${chips}
              <div class="chip ${customActive?'active':''}" data-illness-custom="1">+ Other</div>
            </div>
            ${customActive ? `<input type="text" id="customIllness" value="${escapeHtml(activeIllness)}" placeholder="Illness name…" style="margin-top:8px;width:100%">` : ''}
          </div>
          <div>
            <div class="section-title" style="margin:0 0 8px">Note</div>
            <textarea id="sickNote" class="sick-note" placeholder="Symptoms, medication, how you feel…">${escapeHtml(activeNote)}</textarea>
          </div>
          ${carrying ? `<div style="font-size:12px;color:var(--muted)">Carried from ${sick._carriedFrom}. Any edit saves to this day.</div>`:''}
        </div>
      ` : ''}
    </div>

    <div class="section">
      <div class="section-title">Event</div>
      <textarea class="event-note" id="eventNote" placeholder="What happened today?">${escapeHtml(entry.event||'')}</textarea>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <button class="btn ghost" id="prevDay">← Previous day</button>
      <button class="btn ghost" id="nextDay">Next day →</button>
    </div>
  `;

  bindEditorHandlers();
}

function bindEditorHandlers(){
  const key = State.editingDay;

  $('#closeSheet').onclick = closeDayEditor;

  // Habit toggle
  $$('.habit-check').forEach(el=>{
    el.onclick = () => {
      const hid = el.dataset.habitToggle;
      const cur = !!State.days[key]?.habits?.[hid]?.done;
      setHabitDone(key, hid, !cur);
      renderDayEditor();
    };
  });
  // Habit freq change
  $$('select[data-habit-freq]').forEach(sel=>{
    sel.onchange = () => {
      updateHabit(sel.dataset.habitFreq, { frequency: sel.value });
      renderDayEditor();
    };
  });
  // Delete habit
  $$('[data-habit-del]').forEach(btn=>{
    btn.onclick = () => {
      const hid = btn.dataset.habitDel;
      if (confirm('Delete this habit? Past entries are kept.')){
        deleteHabit(hid);
        renderDayEditor();
      }
    };
  });

  // Add habit
  $('#addHabitForm').onsubmit = e => {
    e.preventDefault();
    const name = $('#newHabitName').value.trim();
    const freq = $('#newHabitFreq').value;
    if (!name) return;
    createHabit(name, freq);
    renderDayEditor();
  };

  // Mood
  $$('.mood-btn').forEach(b=>{
    b.onclick = () => {
      const id = b.dataset.mood;
      const cur = State.days[key]?.mood;
      setMood(key, cur===id ? null : id);
      renderDayEditor();
    };
  });

  // Health toggle
  $$('[data-sick]').forEach(b=>{
    b.onclick = () => {
      const v = b.dataset.sick;
      if (v === 'clear'){
        setSick(key, null);
      } else if (v === 'fine'){
        setSick(key, { status:'fine', illness:null, note:'' });
      } else {
        const cur = State.days[key]?.sick || effectiveSick(key) || {};
        setSick(key, { status:'sick', illness: cur.illness || 'Cold', note: cur.note || '' });
      }
      renderDayEditor();
    };
  });

  // Illness chips
  $$('[data-illness]').forEach(c=>{
    c.onclick = () => {
      const cur = State.days[key]?.sick || { status:'sick', note:'' };
      setSick(key, { ...cur, status:'sick', illness: c.dataset.illness });
      renderDayEditor();
    };
  });
  const customBtn = document.querySelector('[data-illness-custom]');
  if (customBtn){
    customBtn.onclick = () => {
      const cur = State.days[key]?.sick || { status:'sick', note:'' };
      const name = prompt('Illness name:', cur.illness && !COMMON_ILLNESSES.includes(cur.illness) ? cur.illness : '');
      if (name && name.trim()){
        setSick(key, { ...cur, status:'sick', illness: name.trim() });
        renderDayEditor();
      }
    };
  }
  const customInput = $('#customIllness');
  if (customInput){
    customInput.oninput = () => {
      const cur = State.days[key]?.sick || { status:'sick', note:'' };
      setSick(key, { ...cur, status:'sick', illness: customInput.value });
    };
  }

  // Sick note
  const sn = $('#sickNote');
  if (sn){
    sn.oninput = () => {
      const cur = State.days[key]?.sick || { status:'sick', illness:null };
      setSick(key, { ...cur, status:'sick', note: sn.value });
    };
  }

  // Event note
  const en = $('#eventNote');
  if (en){
    en.oninput = () => setEvent(key, en.value);
  }

  // Prev/next day
  $('#prevDay').onclick = () => {
    const prev = addDays(parseKey(key), -1);
    State.editingDay = dateKey(prev);
    renderDayEditor();
  };
  $('#nextDay').onclick = () => {
    const next = addDays(parseKey(key), 1);
    State.editingDay = dateKey(next);
    renderDayEditor();
  };
}

/* ============================================================
   VIEW HANDLERS
   ============================================================ */
function bindViewHandlers(){
  $$('[data-day]').forEach(el=>{
    el.onclick = () => openDayEditor(el.dataset.day);
  });
  $$('[data-cal]').forEach(b=>{
    b.onclick = () => {
      const a = b.dataset.cal;
      if (a==='prev') State.cursor = new Date(State.cursor.getFullYear(), State.cursor.getMonth()-1, 1);
      else if (a==='next') State.cursor = new Date(State.cursor.getFullYear(), State.cursor.getMonth()+1, 1);
      else if (a==='today') State.cursor = new Date();
      renderCurrentView();
    };
  });
  $$('[data-heat]').forEach(b=>{
    b.onclick = () => {
      const d = b.dataset.heat === 'prev' ? -1 : 1;
      State.cursor = new Date(State.cursor.getFullYear()+d, 0, 1);
      renderCurrentView();
    };
  });
}

/* ============================================================
   NAV + MENU + EXPORT/IMPORT
   ============================================================ */
function initNav(){
  $$('#nav button').forEach(b=>{
    b.onclick = ()=>{
      State.view = b.dataset.view;
      $$('#nav button').forEach(x=>x.classList.toggle('active', x===b));
      renderCurrentView();
    };
  });
  $('#overlay').addEventListener('click', e => { if (e.target.id==='overlay') closeDayEditor(); });
  document.addEventListener('keydown', e => {
    if (e.key==='Escape' && State.editingDay) closeDayEditor();
  });

  $('#menuBtn').onclick = e => {
    e.stopPropagation();
    $('#menu').classList.toggle('open');
  };
  document.addEventListener('click', ()=> $('#menu').classList.remove('open'));
  $('#menu').addEventListener('click', e => e.stopPropagation());

  $('#signinBtn').onclick = ()=> requestToken({prompt:'consent'});
  $('#signoutBtn').onclick = async ()=>{
    if (State._accessToken) google.accounts.oauth2.revoke(State._accessToken, ()=>{});
    State._accessToken = null; State._signedIn = false; State._userEmail = null;
    await dbSet('authHint', null);
    renderMenu();
    setSyncStatus('offline','Local only');
  };
  $('[data-action="sync"]').onclick = ()=> syncNow();
  $('[data-action="export"]').onclick = ()=>{
    const blob = new Blob([JSON.stringify(buildExportObject(), null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `journal-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  $('[data-action="import"]').onclick = ()=> $('#importFile').click();
  $('#importFile').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!confirm('Merge this file into your current data?\n\nExisting entries with newer timestamps win; otherwise the imported entry replaces them.')) return;
      const changed = mergeRemote(data);
      if (changed){
        await persistLocal();
        if (State._signedIn) scheduleSave();
        renderCurrentView();
        toast('Imported', 'success');
      } else {
        toast('Nothing new to import');
      }
    } catch(err){
      toast('Import failed: ' + err.message, 'error');
    }
    e.target.value = '';
  };
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  await loadLocal();
  initNav();
  renderCurrentView();
  setSyncStatus('offline','Local only');
  renderMenu();

  // Auth init
  try {
    await initAuth();
  } catch(e){
    toast('Could not load Google sign-in. Offline mode.', 'error');
  }

  // Refetch on focus
  window.addEventListener('focus', ()=>{ if (State._signedIn) syncNow(); });
  window.addEventListener('online', ()=>{ if (State._signedIn) syncNow(); });

  // Poll
  setInterval(()=>{ if (State._signedIn && document.visibilityState === 'visible') syncNow(); }, CONFIG.POLL_INTERVAL_MS);

  // Push unsaved on unload (best effort)
  window.addEventListener('beforeunload', () => {
    if (State._dirty && State._signedIn && State._driveFileId){
      // Fire-and-forget — may or may not land, but IndexedDB has it
      try {
        navigator.sendBeacon && navigator.sendBeacon(
          `https://www.googleapis.com/upload/drive/v3/files/${State._driveFileId}?uploadType=media&access_token=${encodeURIComponent(State._accessToken||'')}`,
          new Blob([JSON.stringify(buildExportObject())], {type:'application/json'})
        );
      } catch(_){}
    }
  });
}

boot();
</script>
