  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); go(); } });
}

let popEl=null;
function popMenu(anchor,items){
  closePop();
  const el=document.createElement('div');
  el.className='pop-menu';
  el.innerHTML=items.map(i=> i.sep?'<hr>':
    '<button data-pop="'+i.id+'" class="'+(i.danger?'bad':'')+'">'+(i.icon||'')+esc(i.label)+'</button>').join('');
  document.body.appendChild(el);
  const r=anchor.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  let left=Math.min(r.right-w, window.innerWidth-w-10); left=Math.max(10,left);
  let top=r.bottom+6; if(top+h>window.innerHeight-10) top=Math.max(10,r.top-h-6);
  el.style.left=left+'px'; el.style.top=top+'px';
  el.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-pop]'); if(!b) return;
    const id=b.dataset.pop; closePop();
    const it=items.find(x=>x.id===id); if(it&&it.run) it.run();
  });
  popEl=el;
}
function closePop(){ if(popEl){ popEl.remove(); popEl=null; } }

/* ══ drag to reorder ══════════════════════ */
const Drag={on:false,kind:null,id:null,el:null,from:null,ghostTimer:null,moved:false,suppress:false};

function startDrag(ev,kind,id){
  const el=ev.target.closest('[data-sortable]');
  if(!el) return;
  Drag.on=true; Drag.kind=kind; Drag.id=id; Drag.el=el; Drag.moved=false;
  Drag.from=el.parentElement;
  el.classList.add('dragging');
  document.body.classList.add('drag-on');
  try{ ev.target.setPointerCapture(ev.pointerId); }catch(_){}
}
function moveDrag(ev){
  if(!Drag.on) return;
  Drag.moved=true;
  const y=ev.clientY, x=ev.clientX;
  const el=Drag.el;

  if(Drag.kind==='group'){
    const groups=[...document.querySelectorAll('.group[data-sortable=group]')].filter(g=>g!==el);
    for(const g of groups){
      const r=g.getBoundingClientRect();
      if(y>r.top&&y<r.bottom){
        const before=y<r.top+r.height/2;
        g.parentElement.insertBefore(el, before?g:g.nextSibling);
        break;
      }
    }
    autoScroll(y); return;
  }

  // habit: find which list the pointer is over, then where in it
  el.style.pointerEvents='none';
  const under=document.elementFromPoint(x,y);
  el.style.pointerEvents='';
  const list=under&&under.closest?under.closest('[data-droplist]'):null;
  document.querySelectorAll('[data-droplist]').forEach(l=>l.classList.remove('over'));
  if(list){
    if(list!==el.parentElement) list.classList.add('over');
    const sibs=[...list.querySelectorAll(':scope > .habit')].filter(c=>c!==el);
    let placed=false;
    for(const s of sibs){
      const r=s.getBoundingClientRect();
      if(y<r.top+r.height/2){ list.insertBefore(el,s); placed=true; break; }
    }
    if(!placed) list.appendChild(el);
    const ph=list.querySelector('.g-empty'); if(ph) ph.remove();
  }
  autoScroll(y);
}
function autoScroll(y){
  const m=$('#main'); const r=m.getBoundingClientRect();
  if(y<r.top+70) m.scrollTop-=12;
  else if(y>r.bottom-70) m.scrollTop+=12;
}
function endDrag(){
  if(!Drag.on) return;
  const el=Drag.el;
  el.classList.remove('dragging');
  document.body.classList.remove('drag-on');
  document.querySelectorAll('[data-droplist]').forEach(l=>l.classList.remove('over'));

  if(Drag.moved){
    if(Drag.kind==='group'){
      const order=[...document.querySelectorAll('.group[data-sortable=group]')].map(g=>g.dataset.id);
      order.forEach((id,i)=>{ if(S.groups[id]){ S.groups[id].order=i+1; S.groups[id].updatedAt=nowISO(); } });
    } else {
      document.querySelectorAll('[data-droplist]').forEach(list=>{
        const gid=list.dataset.group||null;
        [...list.querySelectorAll(':scope > .habit')].forEach((c,i)=>{
          const h=S.habits[c.dataset.id]; if(!h) return;
          const ng=gid||null;
          if(h.order!==i+1||(h.groupId||null)!==ng){ h.order=i+1; h.groupId=ng; h.updatedAt=nowISO(); }
        });
      });
    }
    commit(null);
    Drag.suppress=true; setTimeout(()=>{Drag.suppress=false;},300);
  }
  Drag.on=false; Drag.kind=null; Drag.id=null; Drag.el=null; Drag.moved=false;
  draw();
}

document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]');
  if(!g) return;
  e.preventDefault();
  startDrag(e,g.dataset.grip,g.dataset.id);
},{passive:false});
document.addEventListener('pointermove',e=>{ if(Drag.on){ e.preventDefault(); moveDrag(e); } },{passive:false});
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ══ render ═══════════════════════════════ */
function draw(){
  drawHeader(); drawNav();
  const m=$('#main');
  if(S.page==='habits') m.innerHTML=pageHabits();
  else if(S.page==='event') m.innerHTML=pageEvent();
  else if(S.page==='health') m.innerHTML=pageHealth();
  else if(S.page==='cal') m.innerHTML=pageCal();
  else m.innerHTML=pageYear();
}

/* ══ events ═══════════════════════════════ */
document.addEventListener('click',e=>{
  if(Drag.suppress){ e.preventDefault(); e.stopPropagation(); return; }

  const menu=$('#menu');
  if(!e.target.closest('#menu')&&!e.target.closest('#dotsBtn')) menu.classList.remove('show');
  if(!e.target.closest('.pop-menu')&&!e.target.closest('[data-act=hmenu]')&&
     !e.target.closest('[data-act=gmenu]')&&!e.target.closest('[data-act=pagemenu]')) closePop();

  if(e.target.closest('#dotsBtn')){ menu.classList.toggle('show'); return; }
  if(e.target===$('#daySheet')){ closeSheet(); return; }
  if(e.target===$('#askBox')){ closeAsk(); return; }

  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, k=t.dataset.k;

  switch(a){
    case 'page': S.page=t.dataset.page; draw(); $('#main').scrollTop=0; break;

    case 'tick': {
      const hid=t.dataset.h, d=dayFor(k);
      const on=!!(d&&d.habits&&d.habits[hid]&&d.habits[hid].done);
      tickHabit(k,hid,!on);
      if(!S.draft){ if(S.sheetDate) drawSheet(); else draw(); }
      break;
    }
    case 'fold': {
      const g=t.dataset.g;
      if(S.collapsed.has(g)) S.collapsed.delete(g); else S.collapsed.add(g);
      saveCollapsed(); draw();
      break;
    }
    case 'mood': {
      const id=t.dataset.m, cur=(dayFor(k)||{}).mood;
      putMood(k,cur===id?null:id);
      if(!S.draft){ if(S.sheetDate) drawSheet(); else draw(); }
      break;
    }
    case 'sick': {
      const v=t.dataset.v, own=(dayFor(k)||{}).sick, cur=own||sickOn(k)||{};
      if(v==='fine') putSick(k, own&&own.status==='fine' ? null : {status:'fine',illness:null,note:''});
      else putSick(k, own&&own.status==='sick' ? null : {status:'sick',illness:cur.illness||null,note:cur.note||''});
      if(!S.draft){ if(S.sheetDate) drawSheet(); else draw(); }
      break;
    }
    case 'ill': {
      const cur=(dayFor(k)||{}).sick||sickOn(k)||{note:''};
      const same=cur.illness===t.dataset.v;
      putSick(k,{status:'sick',illness:same?null:t.dataset.v,note:cur.note||''});
      if(!S.draft){ if(S.sheetDate) drawSheet(); else draw(); }
      break;
    }
    case 'illnew':
      S.addingIllness=true;
      if(S.sheetDate) drawSheet(); else draw();
      { const i=document.querySelector('.ill-add input'); if(i) i.focus(); }
      break;
    case 'illcancel':
      S.addingIllness=false;
      if(S.sheetDate) drawSheet(); else draw();
      break;
    case 'illdrop': {
      const o=S.illnesses[t.dataset.id]; if(!o) break;
      ask({title:'Remove "'+o.name+'"?',
        body:'It disappears from the list of options. Days already marked with it keep their record.',
        yes:'Yes, remove',no:'No, keep it',danger:true,
        onYes(){ dropIllness(o.id); if(S.sheetDate) drawSheet(); else draw(); }});
      break;
    }

    case 'newgroup':
      promptBox({title:'New group',label:'Group name',placeholder:'Morning routine',ok:'Create',max:50,
        onOk(v){ addGroup(v); draw(); toast('Group added','good'); }});
      break;
    case 'pagemenu':
      popMenu(t,[
        {id:'addh',label:'Add habit',icon:ICON.plus,run(){ newHabitDialog(null); }},
        {id:'addg',label:'Add group',icon:ICON.folder,run(){
          promptBox({title:'New group',label:'Group name',placeholder:'Morning routine',ok:'Create',max:50,
            onOk(v){ addGroup(v); draw(); toast('Group added','good'); }}); }}
      ]);
      break;
    case 'gmenu': {
      const g=S.groups[t.dataset.g]; if(!g) break;
      popMenu(t,[
        {id:'addh',label:'Add habit here',icon:ICON.plus,run(){ newHabitDialog(g.id); }},
        {id:'ren',label:'Rename group',icon:ICON.pencil,run(){
          promptBox({title:'Rename group',label:'Group name',value:g.name,ok:'Save',max:50,
            onOk(v){ editGroup(g.id,{name:v}); draw(); }}); }},
        {sep:true,id:'s1'},
        {id:'del',label:'Delete group',icon:ICON.trash,danger:true,run(){
          const n=liveHabits(g.id).length;
          ask({title:'Delete "'+g.name+'"?',
            body:n?('The group goes away. Its '+n+(n===1?' habit':' habits')+' stay in your list, just outside any group.')
                  :'The group goes away. It has no habits in it.',
            yes:'Yes, delete',no:'No, keep it',danger:true,
            onYes(){ dropGroup(g.id); draw(); toast('Group deleted'); }}); }}
      ]);
      break;
    }
    case 'hmenu': {
      const h=S.habits[t.dataset.h]; if(!h) break;
      const groups=liveGroups();
      const items=[
        {id:'freq',label:'Change how often',icon:ICON.cal,run(){ freqDialog(h); }},
        {id:'ren',label:'Rename habit',icon:ICON.pencil,run(){
          promptBox({title:'Rename habit',label:'Habit name',value:h.name,ok:'Save',max:70,
            onOk(v){ editHabit(h.id,{name:v}); if(S.sheetDate) drawSheet(); else draw(); }}); }}
      ];
      if(groups.length) items.push({id:'move',label:'Move to group',icon:ICON.tag,run(){ moveDialog(h); }});
      items.push({sep:true,id:'s1'});
      items.push({id:'del',label:'Delete habit',icon:ICON.trash,danger:true,run(){
        ask({title:'Delete "'+h.name+'"?',
          body:'It disappears from today onward. Days you already ticked keep their record.',
          yes:'Yes, delete',no:'No, keep it',danger:true,
          onYes(){ dropHabit(h.id); if(S.sheetDate) drawSheet(); else draw(); toast('Habit deleted'); }}); }});
      popMenu(t,items);
      break;
    }

    case 'open': openSheet(k); break;
    case 'closesheet': closeSheet(); break;
    case 'askedit': askEdit(k); break;
    case 'saveedit': saveEdit(); break;
    case 'canceledit': cancelEdit(false); break;
    case 'sday':
      S.sheetDate=key(shift(fromKey(S.sheetDate),Number(t.dataset.d)));
      S.editing=null; S.draft=null;
      drawSheet(); { const b=document.querySelector('.sheet-body'); if(b) b.scrollTop=0; }
      break;

    case 'mon': {
      const d=Number(t.dataset.d);
      S.month=d===0?new Date():new Date(S.month.getFullYear(),S.month.getMonth()+d,1);
      draw(); break;
    }
    case 'yr': S.year+=Number(t.dataset.d); draw(); break;
    case 'ytab': S.yearTab=t.dataset.v; draw(); break;

    case 'askyes': { const p=askPending; closeAsk(); if(p&&p.onYes) p.onYes(); break; }
    case 'askno': closeAsk(); break;

    case 'signin': menu.classList.remove('show'); startSignIn(); break;
    case 'signout':
      menu.classList.remove('show');
      if(S.token&&window.google) google.accounts.oauth2.revoke(S.token,()=>{});
      S.token=null;S.signedIn=false;S.email=null;S.authHint=null;S.everSignedIn=false;
      kvPut('authHint',null); kvPut('everSignedIn',false);
      drawMenu(); setSync('','Local only'); break;
    case 'why': menu.classList.remove('show'); explainConnection(); break;
    case 'syncnow': menu.classList.remove('show'); syncNow(); break;
    case 'export': {
      menu.classList.remove('show');
      const bl=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});
      const u=URL.createObjectURL(bl), a2=document.createElement('a');
      a2.href=u; a2.download='journal-'+today()+'.json'; a2.click(); URL.revokeObjectURL(u);
      break;
    }
    case 'import': menu.classList.remove('show'); $('#file').click(); break;
  }
});

function newHabitDialog(groupId){
  askPending=null;
  const gs=liveGroups();
  $('#askBox').innerHTML='<div class="ask"><h3>New habit</h3>'+
    '<label for="nhName">What is it?</label>'+
    '<input id="nhName" maxlength="70" placeholder="Evening walk" autocomplete="off">'+
    '<label for="nhFreq">How often?</label>'+
    '<select id="nhFreq">'+FREQS.map(f=>'<option value="'+f.id+'">'+f.label+'</option>').join('')+'</select>'+
    (gs.length?'<label for="nhGroup">Group</label><select id="nhGroup">'+
      '<option value="">No group</option>'+
      gs.map(g=>'<option value="'+g.id+'"'+(g.id===groupId?' selected':'')+'>'+esc(g.name)+'</option>').join('')+
      '</select>':'')+
    '<div class="row"><button class="btn" data-act="askno">Cancel</button>'+
    '<button class="btn btn-lamp" id="nhOk">Add habit</button></div></div>';
  $('#askBox').classList.add('show');
  setTimeout(()=>{ try{ $('#nhName').focus(); }catch(_){} },60);
  const go=()=>{
    const nm=$('#nhName').value.trim(); if(!nm) return;
    const gsel=$('#nhGroup');
    addHabit(nm,$('#nhFreq').value, gsel?(gsel.value||null):(groupId||null));
    closeAsk(); draw(); toast('Habit added','good');
  };
  $('#nhOk').onclick=go;
  $('#nhName').addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); go(); } });
}
function freqDialog(h){
  askPending=null;
  $('#askBox').innerHTML='<div class="ask"><h3>'+esc(h.name)+'</h3>'+
    '<label for="fqSel">How often do you want to do this?</label>'+
    '<select id="fqSel">'+FREQS.map(f=>'<option value="'+f.id+'"'+(f.id===h.frequency?' selected':'')+'>'+f.label+'</option>').join('')+'</select>'+
    '<div class="row"><button class="btn" data-act="askno">Cancel</button>'+
    '<button class="btn btn-lamp" id="fqOk">Save</button></div></div>';
  $('#askBox').classList.add('show');
  $('#fqOk').onclick=()=>{ editHabit(h.id,{frequency:$('#fqSel').value}); closeAsk(); if(S.sheetDate) drawSheet(); else draw(); };
}
function moveDialog(h){
  askPending=null;
  const gs=liveGroups();
  $('#askBox').innerHTML='<div class="ask"><h3>Move "'+esc(h.name)+'"</h3>'+
    '<label for="mvSel">Which group?</label>'+
    '<select id="mvSel"><option value="">No group</option>'+
    gs.map(g=>'<option value="'+g.id+'"'+(g.id===h.groupId?' selected':'')+'>'+esc(g.name)+'</option>').join('')+'</select>'+
    '<div class="row"><button class="btn" data-act="askno">Cancel</button>'+
    '<button class="btn btn-lamp" id="mvOk">Move</button></div></div>';
  $('#askBox').classList.add('show');
  $('#mvOk').onclick=()=>{
    const v=$('#mvSel').value||null;
    let top=0; for(const i in S.habits) if((S.habits[i].groupId||null)===v) top=Math.max(top,S.habits[i].order||0);
    editHabit(h.id,{groupId:v,order:top+1});
    closeAsk(); draw();
  };
}
function explainConnection(){
  const b=authBlocker();
  if(b){ const t=BLOCKER_TEXT[b]; ask({title:t.title,body:t.body,yes:'Got it',no:'Close',onYes(){}}); }
  else ask({title:'Sign-in is ready',body:'Nothing is blocking it from this address. Tap sign in and pick your Google account.',
    yes:'Sign in',no:'Close',onYes(){ startSignIn(); }});
}

/* text input: never re-render, it would lose the caret */
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, k=t.dataset.k;
  if(a==='event'){
    const d=dayFor(k)||day(k); d.event=t.value;
    if(S.draft&&S.draft.key===k){ S.draft.day.event=t.value; } else commit(k);
    const foot=t.parentElement.querySelector('.note-foot span');
    if(foot){ const w=t.value.trim()?t.value.trim().split(/\s+/).length:0;
      foot.textContent=w?w+(w===1?' word':' words'):'Nothing written yet'; }
  } else if(a==='sicknote'){
    const cur=(dayFor(k)||{}).sick||sickOn(k)||{};
    const v={status:'sick',illness:cur.illness||null,note:t.value};
    if(S.draft&&S.draft.key===k) S.draft.day.sick=v; else { day(k).sick=v; commit(k); }
  } else if(a==='moodnote'){
    if(S.draft&&S.draft.key===k) S.draft.day.moodNote=t.value; else { day(k).moodNote=t.value; commit(k); }
  }
});

document.addEventListener('submit',e=>{
  const ill=e.target.closest('[data-act="illsave"]');
  if(ill){
    e.preventDefault();
    const k=ill.dataset.k;
    const name=addIllness(ill.querySelector('[name=iname]').value);
    S.addingIllness=false;
    if(name){
      const cur=(dayFor(k)||{}).sick||sickOn(k)||{note:''};
      putSick(k,{status:'sick',illness:name,note:cur.note||''});
    }
    if(S.sheetDate) drawSheet(); else draw();
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#askBox').classList.contains('show')) closeAsk();
    else if(popEl) closePop();
    else if(S.editing) cancelEdit(false);
    else if(S.sheetDate) closeSheet();
  }
});

$('#file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    ask({title:'Merge this file in?',body:'Entries that are newer than what you have will replace them. Nothing else is touched.',
      yes:'Yes, merge',no:'No, cancel',
      async onYes(){
        if(merge(data)){ await saveLocal(); S.dirty=true; if(S.signedIn) syncNow(); draw(); toast('Merged','good'); }
        else toast('Nothing newer to merge');
      }});
  }catch(_){ toast('That file could not be read','bad'); }
  e.target.value='';
};

/* ══ boot ═════════════════════════════════ */
(async function boot(){
  await loadLocal(); bump(); draw(); drawMenu(); setSync('','Local only');
  try{ await initAuth(); }catch(_){ drawMenu(); setSync('','Local only'); }

  window.addEventListener('focus',()=>{ if(S.signedIn&&!S.editing) syncNow(); });
  window.addEventListener('online',()=>{ if(S.signedIn&&!S.editing) syncNow(); });
  setInterval(()=>{ if(S.signedIn&&!S.editing&&document.visibilityState==='visible') syncNow(); },CONFIG.POLL);

  // the heatmap has a different shape on narrow screens
  let wasNarrow=narrow();
  window.addEventListener('resize',()=>{
    const n=narrow();
    if(n!==wasNarrow){ wasNarrow=n; if(S.page==='year') draw(); }
  });

  setInterval(()=>{
    if(S.page!=='cal'&&S.page!=='year'){
      const shown=$('#headDate').querySelector('.md');
      const want=new Date().getDate()+' '+MONTH[new Date().getMonth()];
      if(shown&&shown.textContent!==want) draw();
    }
  },60000);

  window.addEventListener('beforeunload',()=>{
    if(S.dirty&&S.signedIn&&S.fileId&&navigator.sendBeacon){
      try{ navigator.sendBeacon('https://www.googleapis.com/upload/drive/v3/files/'+S.fileId+
        '?uploadType=media&access_token='+encodeURIComponent(S.token||''),
        new Blob([JSON.stringify(payload())],{type:'application/json'})); }catch(_){}
    }
  });
})();
</script>
