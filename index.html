<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#14100D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ground — warm brown-black, lamplit room */
    --ground:#14100D;
    --raised:#1D1813;
    --lit:#261F18;
    --hair:#332A21;
    --hair-bright:#473B2E;

    --ink:#F0E9DE;
    --ink-soft:#9C9183;
    --ink-dim:#6B6054;

    --lamp:#E3A648;
    --lamp-deep:#A8762B;

    --done:#62A86B;
    --done-deep:#2E4A33;
    --miss:#CE4B3C;
    --miss-deep:#4A211B;
    --sick:#B06A4A;

    --mood-terrible:#7A3B4A;
    --mood-okay:#6B6054;
    --mood-alright:#5B7E8C;
    --mood-good:#6E9E6A;
    --mood-happy:#E3A648;

    --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
    --serif:'Newsreader',Georgia,serif;

    --tab-h:62px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html{height:100%}
  body{
    margin:0;height:100%;
    background:var(--ground);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  input,textarea,select{
    font-family:var(--sans);font-size:16px;color:var(--ink);
    background:var(--ground);border:1px solid var(--hair);
    border-radius:8px;padding:11px 13px;outline:none;width:100%;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--hair-bright)}
  input::placeholder,textarea::placeholder{color:var(--ink-dim)}
  textarea{resize:none}
  :focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .fig{font-variant-numeric:tabular-nums}

  /* ── shell ─────────────────────────────────── */
  #shell{display:flex;flex-direction:column;height:100dvh}

  header{
    flex:none;display:flex;align-items:flex-start;gap:14px;
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  }
  .head-date{flex:1;min-width:0}
  .head-date .dow{
    font-family:var(--serif);font-size:27px;line-height:1.1;
    font-weight:400;letter-spacing:-.01em;display:block;
  }
  .head-date .md{
    font-family:var(--serif);font-size:27px;line-height:1.1;
    font-weight:400;color:var(--ink-dim);letter-spacing:-.01em;display:block;
  }
  .head-date .ctx{
    font-size:12px;color:var(--ink-soft);margin-top:5px;
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  }
  .head-tools{flex:none;display:flex;align-items:center;gap:4px;padding-top:4px;position:relative}

  .sync{
    width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
  }
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);display:block}
  .sync.ok i{background:var(--done)}
  .sync.busy i{background:var(--lamp);animation:breathe 1.4s ease-in-out infinite}
  .sync.bad i{background:var(--miss)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.25}}

  .dots{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft)}
  .dots:active{background:var(--raised)}

  main{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 18px calc(26px + var(--tab-h) + env(safe-area-inset-bottom));
  }

  /* ── bottom tabs ───────────────────────────── */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:grid;grid-template-columns:repeat(5,1fr);
    background:rgba(20,16,13,.93);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    border-top:1px solid var(--hair);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    height:var(--tab-h);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;
    color:var(--ink-dim);position:relative;
  }
  nav button span{font-size:10.5px;font-weight:500;letter-spacing:.01em}
  nav button svg{width:21px;height:21px;stroke-width:1.6}
  nav button[aria-current=true]{color:var(--lamp)}
  nav button[aria-current=true]::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:26px;height:2px;background:var(--lamp);border-radius:0 0 2px 2px;
    box-shadow:0 0 14px 1px var(--lamp);
  }
  nav .badge{
    position:absolute;top:9px;left:calc(50% + 8px);
    min-width:15px;height:15px;padding:0 4px;border-radius:8px;
    background:var(--miss);color:#fff;font-size:9.5px;font-weight:600;
    display:grid;place-items:center;line-height:1;
  }

  /* ── warning band ──────────────────────────── */
  .warn{
    display:flex;align-items:center;gap:11px;
    background:linear-gradient(90deg,rgba(206,75,60,.17),rgba(206,75,60,.04));
    border-left:3px solid var(--miss);
    border-radius:3px 9px 9px 3px;
    padding:13px 15px;margin-bottom:16px;
  }
  .warn svg{width:19px;height:19px;flex:none;color:var(--miss)}
  .warn b{color:var(--miss);font-weight:600}
  .warn p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.4}

  /* ── read-only / edit gate ─────────────────── */
  .gate{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--raised);border:1px dashed var(--hair-bright);
    border-radius:11px;padding:13px 15px;margin-bottom:18px;
  }
  .gate p{margin:0;flex:1;min-width:150px;font-size:13px;color:var(--ink-soft);line-height:1.45}
  .gate.open{border-style:solid;border-color:var(--lamp-deep);background:rgba(227,166,72,.07)}
  .gate.open p{color:var(--lamp)}

  /* ── buttons ───────────────────────────────── */
  .btn{
    min-height:42px;padding:0 17px;border-radius:9px;
    background:var(--lit);border:1px solid var(--hair);
    font-size:14px;font-weight:500;display:inline-flex;
    align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{background:var(--hair)}
  .btn-lamp{background:var(--lamp);border-color:var(--lamp);color:#1C1409;font-weight:600}
  .btn-lamp:active{background:var(--lamp-deep)}
  .btn-quiet{background:none;border-color:transparent;color:var(--ink-soft)}
  .btn-quiet:active{background:var(--raised)}
  .btn-sm{min-height:36px;padding:0 13px;font-size:13px}

  /* ── habit cards ───────────────────────────── */
  .habit{
    position:relative;display:flex;align-items:center;gap:14px;
    background:var(--raised);border:1px solid var(--hair);
    border-radius:13px;padding:15px 16px;margin-bottom:9px;
    min-height:62px;overflow:hidden;
  }
  .habit > *{position:relative;z-index:1}
  .habit .tick{
    flex:none;width:30px;height:30px;border-radius:9px;
    border:1.8px solid #615241;background:rgba(0,0,0,.25);
    display:grid;place-items:center;color:transparent;
  }
  .habit .tick:active{transform:scale(.92)}
  .habit .tick svg{width:17px;height:17px;stroke-width:2.6}
  .habit .body{flex:1;min-width:0}
  .habit .nm{
    font-size:15.5px;font-weight:500;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .habit .sub{font-size:12px;color:var(--ink-dim);margin-top:3px}

  /* done — lit green */
  .habit.done{
    border-color:rgba(98,168,107,.5);
    background:linear-gradient(135deg,rgba(98,168,107,.15),rgba(98,168,107,.05));
    box-shadow:0 0 22px -10px rgba(98,168,107,.55);
  }
  .habit.done .tick{background:var(--done);border-color:var(--done);color:#122116}
  .habit.done .nm{color:#9BD3A1}

  /* missed — red wash */
  .habit.miss{border-color:rgba(206,75,60,.5)}
  .habit.miss::after{
    content:'';position:absolute;inset:0;z-index:0;
    background:linear-gradient(135deg,rgba(206,75,60,.2),rgba(206,75,60,.07));
  }
  .habit.miss .nm{color:#ECA79C}
  .habit.miss .tick{border-color:rgba(206,75,60,.7)}
  .miss-tag{
    flex:none;display:flex;align-items:center;gap:5px;
    background:rgba(206,75,60,.2);border:1px solid rgba(206,75,60,.42);
    color:#ECA79C;font-size:11.5px;font-weight:600;
    padding:4px 9px;border-radius:7px;
  }
  .miss-tag svg{width:12px;height:12px;stroke-width:2.2}

  .habit .kebab{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink-dim)}
  .habit .kebab:active{background:var(--hair)}
  .habit.locked .tick{opacity:.4}

  /* habits footer tally */
  .tally{
    margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);
    display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;
  }
  .tally div{display:flex;flex-direction:column;gap:2px}
  .tally .n{font-family:var(--serif);font-size:25px;line-height:1;font-weight:400}
  .tally .l{font-size:11.5px;color:var(--ink-soft)}
  .tally .red .n{color:var(--miss)}
  .tally .grn .n{color:var(--done)}

  .add-row{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .add-row .pair{display:flex;gap:9px}
  .add-row .pair select{flex:1}
  .add-row .pair .btn{flex:none;min-width:92px}

  /* ── empty states ──────────────────────────── */
  .empty{padding:48px 12px;text-align:center}
  .empty h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 7px}
  .empty p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.5}

  /* ── event page ────────────────────────────── */
  .note-wrap{position:relative}
  .note{
    font-family:var(--serif);font-size:17.5px;line-height:1.68;
    background:var(--raised);border:1px solid var(--hair);
    border-radius:13px;padding:19px;min-height:48vh;
  }
  .note:focus{border-color:var(--hair-bright)}
  .note[readonly]{color:var(--ink-soft);background:var(--ground)}
  .note-foot{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:11px;font-size:12px;color:var(--ink-dim);
  }

  /* ── health page ───────────────────────────── */
  .sect{margin-bottom:30px}
  .sect > h2{
    font-family:var(--serif);font-size:19px;font-weight:400;
    margin:0 0 13px;color:var(--ink);
  }
  .moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .mood{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:14px 2px 11px;border-radius:12px;
    background:var(--raised);border:1.5px solid var(--hair);
  }
  .mood em{font-size:25px;line-height:1;font-style:normal}
  .mood span{font-size:10px;color:var(--ink-dim);font-weight:500}
  .mood.on{background:var(--lit)}
  .mood.on span{color:var(--ink)}
  .mood[data-m=terrible].on{border-color:var(--mood-terrible);box-shadow:0 0 20px -7px var(--mood-terrible)}
  .mood[data-m=okay].on{border-color:#9A8C79;box-shadow:0 0 20px -7px #9A8C79}
  .mood[data-m=alright].on{border-color:var(--mood-alright);box-shadow:0 0 20px -7px var(--mood-alright)}
  .mood[data-m=good].on{border-color:var(--mood-good);box-shadow:0 0 20px -7px var(--mood-good)}
  .mood[data-m=happy].on{border-color:var(--mood-happy);box-shadow:0 0 20px -7px var(--mood-happy)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .seg button{
    min-height:48px;border-radius:11px;font-size:14.5px;font-weight:600;
    background:var(--raised);border:1.5px solid var(--hair);color:var(--ink-soft);
  }
  .seg button.on-fine{background:rgba(98,168,107,.16);border-color:var(--done);color:#9BD3A1}
  .seg button.on-sick{background:rgba(176,106,74,.18);border-color:var(--sick);color:#E0A683}
  .seg button .carry{display:block;font-size:10.5px;font-weight:400;color:var(--ink-dim);margin-top:2px}

  .sickbox{
    margin-top:14px;background:var(--raised);border:1px solid var(--hair);
    border-radius:13px;padding:17px;
  }
  .sickbox > h3{
    font-family:var(--serif);font-size:15.5px;font-weight:400;
    margin:0 0 11px;color:var(--ink-soft);
  }
  .sickbox > h3:not(:first-child){margin-top:19px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    padding:9px 14px;border-radius:999px;font-size:13px;
    background:var(--ground);border:1px solid var(--hair);min-height:38px;
    display:inline-flex;align-items:center;
  }
  .chip.on{background:var(--sick);border-color:var(--sick);color:#20120B;font-weight:600}
  .sick-note{font-family:var(--serif);font-size:16px;line-height:1.6;min-height:92px}
  .day-of{
    margin-top:13px;font-size:12.5px;color:var(--sick);
    display:flex;align-items:center;gap:8px;line-height:1.45;
  }
  .day-of svg{width:15px;height:15px;flex:none}

  /* ── calendar ──────────────────────────────── */
  .cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
  .cal-bar h2{font-family:var(--serif);font-size:22px;font-weight:400;margin:0}
  .cal-bar h2 i{font-style:normal;color:var(--ink-dim)}
  .stepper{display:flex;align-items:center;gap:2px}
  .stepper button{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--ink-soft)}
  .stepper button:active{background:var(--raised)}
  .stepper svg{width:18px;height:18px}

  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .dow-row span{
    text-align:center;font-size:10.5px;color:var(--ink-dim);
    font-weight:500;padding:3px 0;
  }
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{
    aspect-ratio:.82;background:var(--raised);border:1px solid var(--hair);
    border-radius:9px;padding:5px 4px 4px;position:relative;
    display:flex;flex-direction:column;align-items:center;overflow:hidden;
  }
  .cell .d{
    font-family:var(--serif);font-size:14px;line-height:1;
    font-variant-numeric:tabular-nums;align-self:flex-start;padding-left:2px;
  }
  .cell .em{font-size:15px;line-height:1;margin-top:3px}
  .cell .hz{font-size:7.5px;font-weight:600;letter-spacing:.04em;margin-top:2px}
  .cell .hz.s{color:var(--sick)}
  .cell .hz.f{color:var(--done);opacity:.45}
  .cell .pips{display:flex;gap:2.5px;margin-top:auto;padding-bottom:1px;flex-wrap:wrap;justify-content:center}
  .cell .pips i{width:4px;height:4px;border-radius:50%;background:var(--hair-bright);display:block}
  .cell .pips i.d{background:var(--done)}
  .cell .pips i.m{background:var(--miss)}
  .cell .nt{position:absolute;top:5px;right:5px;width:4px;height:4px;border-radius:50%;background:var(--mood-alright)}
  .cell.out{opacity:.25}
  .cell.now{
    border-color:var(--lamp);
    box-shadow:0 0 0 1px var(--lamp) inset,0 0 26px -9px var(--lamp);
  }
  .cell.now .d{color:var(--lamp)}
  .cell.sel{border-color:var(--ink-soft)}

  /* ── year page ─────────────────────────────── */
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px}
  .heat{display:flex;gap:3px;min-width:max-content}
  .heat .wk{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
  .heat button{
    width:13px;height:13px;border-radius:3px;background:var(--raised);
    display:block;border:none;padding:0;
  }
  .heat button[data-m=terrible]{background:var(--mood-terrible)}
  .heat button[data-m=okay]{background:var(--mood-okay)}
  .heat button[data-m=alright]{background:var(--mood-alright)}
  .heat button[data-m=good]{background:var(--mood-good)}
  .heat button[data-m=happy]{background:var(--mood-happy)}
  .heat button.sk{box-shadow:0 0 0 1.5px var(--sick) inset}
  .heat button.gh{opacity:.1}
  .heat button.tdy{box-shadow:0 0 0 2px var(--lamp)}
  .mon-row{display:flex;gap:3px;min-width:max-content;margin-bottom:7px}
  .mon-row span{width:13px;font-size:10px;color:var(--ink-dim);white-space:nowrap;overflow:visible}
  .key{display:flex;flex-wrap:wrap;gap:13px;margin-top:16px;font-size:11.5px;color:var(--ink-soft)}
  .key div{display:flex;align-items:center;gap:6px}
  .key i{width:11px;height:11px;border-radius:2.5px;display:block}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:24px}
  .stat{background:var(--raised);border:1px solid var(--hair);border-radius:12px;padding:15px}
  .stat .l{font-size:11.5px;color:var(--ink-soft);margin-bottom:7px}
  .stat .v{font-family:var(--serif);font-size:28px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:14px;color:var(--ink-dim)}
  .stat .s{font-size:11.5px;color:var(--ink-dim);margin-top:5px}
  .mbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--ground);margin-top:11px}

  .hrow{display:grid;grid-template-columns:1fr auto;gap:10px 13px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}
  .hrow:first-of-type{border-top:none}
  .hrow .nm{font-size:14px;font-weight:500}
  .hrow .fq{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
  .hrow .pct{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
  .hrow .track{grid-column:1/-1;height:5px;border-radius:3px;background:var(--ground);overflow:hidden}
  .hrow .track i{display:block;height:100%;background:var(--done);border-radius:3px}

  .toggle2{display:inline-flex;background:var(--raised);border:1px solid var(--hair);border-radius:10px;padding:3px;margin-bottom:18px}
  .toggle2 button{min-height:34px;padding:0 15px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-soft)}
  .toggle2 button.on{background:var(--lit);color:var(--ink)}

  /* ── sheets & modals ───────────────────────── */
  .scrim{
    position:fixed;inset:0;z-index:60;background:rgba(10,7,5,.72);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    display:none;align-items:flex-end;justify-content:center;
  }
  .scrim.show{display:flex}
  .sheet{
    background:var(--ground);width:100%;max-width:620px;
    border-radius:20px 20px 0 0;border-top:1px solid var(--hair);
    max-height:92dvh;display:flex;flex-direction:column;
    animation:up .26s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet-top{
    flex:none;display:flex;align-items:flex-start;gap:12px;
    padding:20px 18px 14px;border-bottom:1px solid var(--hair);
  }
  .sheet-top .t{flex:1;min-width:0}
  .sheet-top .t b{font-family:var(--serif);font-size:23px;font-weight:400;display:block;line-height:1.1}
  .sheet-top .t i{font-style:normal;font-size:12.5px;color:var(--ink-soft);display:block;margin-top:4px}
  .sheet-body{flex:1;overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet-nav{display:flex;justify-content:space-between;gap:9px;margin-top:8px}
  .x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft);flex:none}
  .x:active{background:var(--raised)}

  .ask{
    background:var(--ground);border:1px solid var(--hair-bright);border-radius:17px;
    width:100%;max-width:370px;padding:24px;margin:auto 16px;
    animation:pop .2s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  .scrim.mid{align-items:center}
  .ask h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 9px;line-height:1.25}

  .ask .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}

  /* ── menu ──────────────────────────────────── */
  .menu{
    position:absolute;right:0;top:42px;z-index:50;min-width:218px;
    background:var(--raised);border:1px solid var(--hair-bright);
    border-radius:13px;padding:5px;display:none;
    box-shadow:0 18px 44px -12px rgba(0,0,0,.8);
  }
  .menu.show{display:block}
  .menu .who{padding:11px 12px 9px;font-size:11.5px;color:var(--ink-dim);word-break:break-all;line-height:1.4}
  .menu hr{border:none;border-top:1px solid var(--hair);margin:4px 0}
  .menu button{
    display:flex;width:100%;padding:11px 12px;border-radius:8px;
    font-size:14px;text-align:left;align-items:center;gap:10px;min-height:42px;
  }
  .menu button:active{background:var(--lit)}
  .menu button svg{width:17px;height:17px;color:var(--ink-soft);flex:none}

  /* ── toasts ────────────────────────────────── */
  .toasts{
    position:fixed;left:0;right:0;z-index:80;
    bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;padding:0 18px;
  }
  .toast{
    background:var(--lit);border:1px solid var(--hair-bright);
    border-radius:10px;padding:11px 16px;font-size:13.5px;
    box-shadow:0 12px 32px -10px rgba(0,0,0,.8);max-width:420px;
    animation:tin .22s ease;
  }
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .toast.bad{border-color:var(--miss);color:#ECA79C}
  .toast.good{border-color:var(--done)}

  /* ── desktop ───────────────────────────────── */
  @media (min-width:760px){
    :root{--tab-h:0px}
    #shell{max-width:860px;margin:0 auto}
    header{padding:28px 32px 18px;align-items:center}
    .head-date .dow,.head-date .md{font-size:34px;display:inline}
    .head-date .md{margin-left:9px}
    nav{
      position:static;display:flex;gap:3px;background:none;backdrop-filter:none;
      -webkit-backdrop-filter:none;border-top:none;border-bottom:1px solid var(--hair);
      padding:0 32px;

    nav button{height:46px;flex-direction:row;gap:8px;padding:0 15px;border-radius:0}
    nav button span{font-size:13.5px}
    nav button svg{width:17px;height:17px}
    nav button[aria-current=true]::before{top:auto;bottom:0;width:100%;border-radius:2px 2px 0 0}
    nav .badge{position:static;margin-left:2px}
    main{padding:24px 32px 60px}
    .scrim{align-items:center;padding:24px}
    .sheet{border-radius:18px;border:1px solid var(--hair)}
    .moods{grid-template-columns:repeat(5,minmax(0,110px));justify-content:start}
    .stats{grid-template-columns:repeat(4,1fr)}
    .cell{aspect-ratio:1.05}
    .cell .d{font-size:15px}
    .cell .em{font-size:18px}
    .cell .hz{font-size:8.5px}
  }
</style>

<body>

<script>
'use strict';

/* ══════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════ */
const CONFIG = {
  GOOGLE_CLIENT_ID: '985235699107-02f7jek8uvp57o5oissq94ms85ujphf8.apps.googleusercontent.com',
  FILE_NAME: 'diary-data.json',
  FOLDER_NAME: 'Diary',
  SCHEMA: 1,
  DEBOUNCE: 2500,
  POLL: 60000,
  SICK_NUDGE_AFTER: 7     // days before "still sick?" hint shows
};

/* ══════════════════════════════════════════════
   SMALL HELPERS
   ══════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const uid = () => 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();

function key(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function fromKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function today(){ return key(new Date()); }
function shift(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function span(a, b){ return Math.round((fromKey(b) - fromKey(a)) / 86400000); }
function pretty(k){
  const d = fromKey(k);
  return d.getDate() + ' ' + MONTH[d.getMonth()];
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(() => el.remove(), 320);
  }, 3000);
}

const MONTH = ['January','February','March','April','May','June',
               'July','August','September','October','November','December'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_MINI = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const FREQS = [
  {id:'daily',     label:'Every day',     n:1},
  {id:'every2',    label:'Every 2 days',  n:2},
  {id:'every3',    label:'Every 3 days',  n:3},
  {id:'every4',    label:'Every 4 days',  n:4},
  {id:'every5',    label:'Every 5 days',  n:5},
  {id:'every6',    label:'Every 6 days',  n:6},
  {id:'every7',    label:'Every 7 days',  n:7},
  {id:'biweekly',  label:'Every 2 weeks', n:14},
  {id:'triweekly', label:'Every 3 weeks', n:21},
  {id:'monthly',   label:'Once a month',  n:30},
  {id:'whenever',  label:'Whenever',      n:null}
];
const freq = id => FREQS.find(f => f.id === id) || FREQS[0];

const MOODS = [
  {id:'terrible', em:'😣', label:'Terrible', c:'var(--mood-terrible)'},
  {id:'okay',     em:'😐', label:'Okay',     c:'var(--mood-okay)'},
  {id:'alright',  em:'🙂', label:'Alright',  c:'var(--mood-alright)'},
  {id:'good',     em:'😊', label:'Good',     c:'var(--mood-good)'},
  {id:'happy',    em:'😄', label:'Happy',    c:'var(--mood-happy)'}
];
const mood = id => MOODS.find(m => m.id === id);

const ILLNESSES = ['Cold','Flu','Strep throat','Stomach bug','Migraine','Fever','Headache'];

const ICON = {
  habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  event:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
  health:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 000-7.8z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  year:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 3a2.8 2.8 0 014 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l6-6-6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  kebab:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
};

/* ══════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════ */
const S = {
  schemaVersion: CONFIG.SCHEMA,
  deviceId: null,
  habits: {},
  days: {},

  page: 'habits',
  month: new Date(),
  year: new Date().getFullYear(),
  yearTab: 'heatmap',
  sheetDate: null,
  unlocked: new Set(),     // date keys the user confirmed editing this session

  signedIn: false,
  email: null,
  token: null,
  tokenExp: 0,
  client: null,
  fileId: null,
  remoteStamp: null,
  dirty: false,
  saveTimer: null
};

/* ══════════════════════════════════════════════
   LOCAL STORE (IndexedDB)
   ══════════════════════════════════════════════ */
let _db = null;
function db(){
  if (_db) return _db;
  _db = new Promise((ok, no) => {
    const r = indexedDB.open('journal-db', 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv');
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
  return _db;
}
async function kvGet(k){
  const d = await db();
  return new Promise((ok, no) => {
    const q = d.transaction('kv','readonly').objectStore('kv').get(k);
    q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error);
  });
}
async function kvPut(k, v){
  const d = await db();
  return new Promise((ok, no) => {
    const q = d.transaction('kv','readwrite').objectStore('kv').put(v, k);
    q.onsuccess = () => ok(); q.onerror = () => no(q.error);
  });
}

async function loadLocal(){
  const x = await kvGet('state');
  if (x){
    S.schemaVersion = x.schemaVersion || CONFIG.SCHEMA;
    S.deviceId   = x.deviceId || null;
    S.habits     = x.habits || {};
    S.days       = x.days || {};
    S.fileId     = x.fileId || null;
    S.remoteStamp= x.remoteStamp || null;
  }
  if (!S.deviceId){ S.deviceId = uid(); }
  await saveLocal();
}
function saveLocal(){
  return kvPut('state', {
    schemaVersion: S.schemaVersion, deviceId: S.deviceId,
    habits: S.habits, days: S.days,
    fileId: S.fileId, remoteStamp: S.remoteStamp
  });
}

/* ══════════════════════════════════════════════
   DERIVED-DATA CACHES
   Rebuilt whenever data changes (stamp bump).
   ══════════════════════════════════════════════ */
let stamp = 0, cacheDone = {}, cacheDoneStamp = -1, cacheSick = null, cacheSickStamp = -1;
function bump(){ stamp++; }

/** sorted list of date keys where this habit was ticked */
function doneDates(hid){
  if (cacheDoneStamp !== stamp){ cacheDone = {}; cacheDoneStamp = stamp; }
  if (!cacheDone[hid]){
    const out = [];
    for (const k in S.days){
      const h = S.days[k].habits;
      if (h && h[hid] && h[hid].done) out.push(k);
    }
    out.sort();
    cacheDone[hid] = out;
  }
  return cacheDone[hid];
}
/** sorted list of date keys carrying an explicit sick/fine entry */
function sickDates(){
  if (cacheSickStamp !== stamp){
    const out = [];
    for (const k in S.days) if (S.days[k].sick) out.push(k);
    out.sort();
    cacheSick = out; cacheSickStamp = stamp;
  }
  return cacheSick;
}
/** greatest element of sorted arr that is < limit (binary search) */
function lastBefore(arr, limit){
  let lo = 0, hi = arr.length - 1, ans = null;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (arr[mid] < limit){ ans = arr[mid]; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
function lastAtOrBefore(arr, limit){
  let lo = 0, hi = arr.length - 1, ans = null;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    if (arr[mid] <= limit){ ans = arr[mid]; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

/* ══════════════════════════════════════════════
   MUTATIONS
   ══════════════════════════════════════════════ */
function day(k){
  if (!S.days[k]) S.days[k] = { date:k, habits:{}, event:'', mood:null, sick:null, updatedAt:nowISO() };
  return S.days[k];
}
function commit(k){
  if (k) day(k).updatedAt = nowISO();
  S.dirty = true;
  bump();
  saveLocal();
  if (S.signedIn){
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(syncNow, CONFIG.DEBOUNCE);
  }
}
function tickHabit(k, hid, on){
  const d = day(k);
  if (!d.habits) d.habits = {};
  if (on) d.habits[hid] = { done:true, doneAt:nowISO() };
  else delete d.habits[hid];
  commit(k);
}
function putEvent(k, text){ day(k).event = text; commit(k); }
function putMood(k, m){ day(k).mood = m; commit(k); }
function putSick(k, v){ day(k).sick = v; commit(k); }

function addHabit(name, f){
  const id = uid();
  let top = 0; for (const i in S.habits) top = Math.max(top, S.habits[i].order || 0);
  S.habits[id] = {
    id, name:String(name).trim().slice(0,70), frequency:f,
    createdAt: today(), deletedAt:null, order: top + 1, updatedAt: nowISO()
  };
  commit(null);
  return id;
}
function editHabit(id, patch){
  if (!S.habits[id]) return;
  Object.assign(S.habits[id], patch, { updatedAt: nowISO() });
  commit(null);
}
function dropHabit(id){
  if (!S.habits[id]) return;
  S.habits[id].deletedAt = nowISO();
  S.habits[id].updatedAt = nowISO();
  commit(null);
}

/* ══════════════════════════════════════════════
   SICK CARRY  — capped at today
   A sick entry carries forward day by day until a later
   day is explicitly marked fine. It never reaches into
   the future, so tomorrow is always blank.
   ══════════════════════════════════════════════ */
function sickOn(k){
  const own = S.days[k] && S.days[k].sick;
  if (own) return Object.assign({}, own, { explicit:true, startedOn:runStart(k) });

  if (k > today()) return null;              // ← the fix: never carry into the future

  const prev = lastBefore(sickDates(), k);
  if (!prev) return null;
  const e = S.days[prev].sick;
  if (e.status !== 'sick') return null;
  return Object.assign({}, e, { explicit:false, carriedFrom:prev, startedOn:prev });
}
/** first day of the sick run that covers k */
function runStart(k){
  const arr = sickDates();
  let start = k;
  let i = arr.indexOf(k);
  if (i === -1){ const p = lastBefore(arr, k); if (p == null) return k; i = arr.indexOf(p); start = p; }
  while (i > 0){
    const prev = arr[i-1];
    if (S.days[prev].sick.status !== 'sick') break;
    start = prev; i--;
  }
  return start;
}

/* ══════════════════════════════════════════════
   HABIT STATE
   ══════════════════════════════════════════════ */
function habitOn(h, k){
  const f = freq(h.frequency);
  const d = S.days[k];
  const done = !!(d && d.habits && d.habits[h.id] && d.habits[h.id].done);

  if (f.n === null) return { done, missed:false, over:0 };     // whenever: never missed
  if (k < h.createdAt) return { done:false, missed:false, over:0, before:true };
  if (done) return { done:true, missed:false, over:0 };
  if (k > today()) return { done:false, missed:false, over:0, future:true };  // can't miss a day that hasn't happened

  const last = lastBefore(doneDates(h.id), k);
  const base = last || h.createdAt;             // resume resets the countdown
  const over = span(base, k) - f.n;
  return over > 0
    ? { done:false, missed:true, over, last }
    : { done:false, missed:false, over:0, last, dueIn: -over };
}
function liveHabits(k){
  const out = [];
  for (const id in S.habits){
    const h = S.habits[id];
    if (!h.deletedAt && k >= h.createdAt) out.push(h);
  }
  return out.sort((a,b) => (a.order||0) - (b.order||0));
}
function missedCount(k){
  let n = 0;
  for (const h of liveHabits(k)) if (habitOn(h, k).missed) n++;
  return n;
}

/* ══════════════════════════════════════════════
   EDIT GATE
   ══════════════════════════════════════════════ */
function canEdit(k){ return k === today() || S.unlocked.has(k); }

function askEdit(k){
  const d = fromKey(k);
  const when = DOW_LONG[d.getDay()] + ', ' + d.getDate() + ' ' + MONTH[d.getMonth()];
  ask({
    title: 'Edit this day?',
    body: 'You are about to change the information saved for ' + when + '. Changes save straight away.',
    yes: 'Yes, edit',
    no: 'No, keep it closed',
    onYes(){
      S.unlocked.add(k);
      if (S.sheetDate === k) drawSheet(); else draw();
    }
  });
}

/* ══════════════════════════════════════════════
   GOOGLE AUTH
   ══════════════════════════════════════════════ */
function loadGIS(){
  return new Promise((ok, no) => {
    if (window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = ok; s.onerror = no;
    document.head.appendChild(s);
  });
}

async function initAuth(){
  await loadGIS();
  const saved = await kvGet('authHint');
  const ever  = await kvGet('everSignedIn');

  S.client = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',
    hint: saved || undefined,
    callback: async r => {
      if (r.error){
        // silent refresh can fail for cookie reasons — stay quiet, offer one tap
        if (['immediate_failed','access_denied','interaction_required','suppressed_by_user'].includes(r.error)){
          if (saved) S.email = saved;
          S.signedIn = false; drawMenu();
          setSync(saved ? 'bad' : '', saved ? 'Tap to resume' : 'Local only');
          return;
        }
        setSync('bad','Sign-in error');
        toast('Sign-in failed: ' + r.error, 'bad');
        return;
      }
      S.token = r.access_token;
      S.tokenExp = Date.now() + (r.expires_in - 60) * 1000;
      S.signedIn = true;
      await kvPut('everSignedIn', true);
      await whoAmI();
      drawMenu();
      await firstSync();
    }
  });

  if (saved){ S.email = saved; drawMenu(); }
  if (ever){
    setTimeout(() => {
      try { S.client.requestAccessToken({ prompt:'', hint: saved || undefined }); }
      catch(_){ setSync('bad','Tap to resume'); }
    }, 400);
  }
}
function freshToken(){
  if (S.token && Date.now() < S.tokenExp) return Promise.resolve(S.token);
  return new Promise((ok, no) => {
    const prev = S.client.callback;
    S.client.callback = r => {
      S.client.callback = prev;
      if (r.error) return no(new Error(r.error));
      S.token = r.access_token;
      S.tokenExp = Date.now() + (r.expires_in - 60) * 1000;
      ok(r.access_token);
    };
    S.client.requestAccessToken({ prompt:'' });
  });
}
async function whoAmI(){
  try {
    const r = await fetch('https://www.googleapis.com/oauth2/v2/userinfo',
      { headers:{ Authorization:'Bearer ' + S.token } });
    if (r.ok){ const j = await r.json(); S.email = j.email; await kvPut('authHint', j.email); }
  } catch(_){}
}

/* ══════════════════════════════════════════════
   DRIVE
   ══════════════════════════════════════════════ */
async function api(path, opts){
  const t = await freshToken();
  opts = opts || {};
  const r = await fetch('https://www.googleapis.com/' + path, Object.assign({}, opts, {
    headers: Object.assign({}, opts.headers || {}, { Authorization:'Bearer ' + t })
  }));
  if (!r.ok) throw new Error('Drive ' + r.status + ': ' + (await r.text()).slice(0,160));
  return r;
}
function payload(){
  return {
    schemaVersion: CONFIG.SCHEMA,
    updatedAt: nowISO(),
    deviceId: S.deviceId,
    habits: S.habits,
    days: S.days
  };
}
async function folderId(){
  const q = encodeURIComponent(
    "name='" + CONFIG.FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const j = await (await api('drive/v3/files?q=' + q + '&fields=files(id)&spaces=drive')).json();
  if (j.files && j.files.length) return j.files[0].id;
  const c = await (await api('drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: CONFIG.FOLDER_NAME, mimeType:'application/vnd.google-apps.folder' })
  })).json();
  return c.id;
}
async function locate(){
  if (S.fileId){
    try {
      const j = await (await api('drive/v3/files/' + S.fileId + '?fields=id,trashed')).json();
      if (!j.trashed) return j;
    } catch(_){ S.fileId = null; }
  }
  const q = encodeURIComponent("name='" + CONFIG.FILE_NAME + "' and trashed=false");
  const j = await (await api('drive/v3/files?q=' + q + '&fields=files(id)&spaces=drive')).json();
  if (j.files && j.files.length){ S.fileId = j.files[0].id; await saveLocal(); return j.files[0]; }
  return null;
}
async function createFile(){
  const parent = await folderId();
  const meta = { name: CONFIG.FILE_NAME, parents:[parent], mimeType:'application/json' };
  const body = payload();
  const b = 'b' + Date.now();
  const multi =
    '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n' +
    '--' + b + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(body) + '\r\n--' + b + '--';
  const j = await (await api('upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b}, body: multi
  })).json();
  S.fileId = j.id; S.remoteStamp = body.updatedAt;
  await saveLocal();
}
async function pull(){
  if (!S.fileId) return null;
  return (await api('drive/v3/files/' + S.fileId + '?alt=media')).json();
}
async function push(){
  if (!S.fileId) return createFile();
  const body = payload();
  await api('upload/drive/v3/files/' + S.fileId + '?uploadType=media&fields=id', {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  S.remoteStamp = body.updatedAt;
  await saveLocal();
}

/** latest-timestamp-wins, per habit and per day */
function merge(remote){
  if (!remote) return false;
  let touched = false;
  const rh = remote.habits || {};
  for (const id in rh){
    const a = rh[id], b = S.habits[id];
    if (!b || new Date(a.updatedAt) > new Date(b.updatedAt)){ S.habits[id] = a; touched = true; }
  }
  const rd = remote.days || {};
  for (const k in rd){
    const a = rd[k], b = S.days[k];
    if (!b || new Date(a.updatedAt) > new Date(b.updatedAt)){ S.days[k] = a; touched = true; }
  }
  if (touched) bump();
  return touched;
}

let busy = false;
async function firstSync(){
  if (!S.signedIn) return;
  setSync('busy','Syncing');
  try {
    if (!await locate()){ await createFile(); }
    else {
      const r = await pull();
      if (merge(r)){ await saveLocal(); draw(); }
      S.remoteStamp = r.updatedAt;
      if (S.dirty) await push();
      await saveLocal();
    }
    setSync('ok','Synced');
  } catch(e){
    console.error(e); setSync('bad','Sync failed'); toast(e.message, 'bad');
  }
}
async function syncNow(){
  if (!S.signedIn){ toast('Sign in to sync'); return; }
  if (busy) return;
  busy = true; setSync('busy','Syncing');
  try {
    if (!await locate()) await createFile();
    else {
      const r = await pull();
      if (merge(r)){ await saveLocal(); draw(); if (S.sheetDate) drawSheet(); }
      S.remoteStamp = r.updatedAt;
      await push();
    }
    S.dirty = false; await saveLocal();
    setSync('ok','Synced');
  } catch(e){
    console.error(e); setSync('bad','Sync failed'); toast(e.message, 'bad');
  } finally { busy = false; }
}

function habitsBlock(k, editable, opts){
  opts = opts || {};
  const list = liveHabits(k);
  if (!list.length){
    return '<div class="empty"><h3>No habits yet</h3>' +
           '<p>Add the first thing you want to keep track of.</p></div>' +
           (editable ? addRow() : '');
  }

  let done = 0, missed = 0, due = 0;
  const rows = list.map(h => {
    const st = habitOn(h, k);
    const f = freq(h.frequency);
    if (st.done) done++;
    if (st.missed) missed++;
    if (st.done || st.missed || (f.n !== null && st.dueIn === 0)) due++;

    let sub = f.label;
    if (f.n === null) sub = 'Whenever you like';
    else if (st.done) sub = 'Done — next in ' + f.n + (f.n === 1 ? ' day' : ' days');
    else if (st.missed) sub = 'Was due ' + st.over + (st.over === 1 ? ' day' : ' days') + ' ago';
    else if (st.future) sub = f.label;
    else if (st.dueIn > 0) sub = 'Due in ' + st.dueIn + (st.dueIn === 1 ? ' day' : ' days');
    else sub = 'Due today';

    return '<div class="habit ' + (st.done ? 'done' : st.missed ? 'miss' : '') +
             (editable ? '' : ' locked') + '">' +
             '<button class="tick" ' + (editable ? 'data-act="tick" data-h="' + h.id + '" data-k="' + k + '"' : 'disabled') +
               ' aria-label="' + (st.done ? 'Mark not done' : 'Mark done') + '">' + ICON.check + '</button>' +
             '<div class="body"><div class="nm">' + esc(h.name) + '</div>' +
               '<div class="sub">' + esc(sub) + '</div></div>' +
             (st.missed ? '<span class="miss-tag">' + ICON.warn + '<span class="fig">' + st.over + 'd</span></span>' : '') +
             (editable ? '<button class="kebab" data-act="hmenu" data-h="' + h.id + '" aria-label="Habit options">' + ICON.kebab + '</button>' : '') +
           '</div>';
  }).join('');

  const tally =
    '<div class="tally">' +
      '<div class="grn"><span class="n fig">' + done + '</span><span class="l">done</span></div>' +
      '<div class="' + (missed ? 'red' : '') + '"><span class="n fig">' + missed + '</span>' +
        '<span class="l">' + (missed === 1 ? 'day missed' : 'days missed') + '</span></div>' +
      '<div><span class="n fig">' + list.length + '</span><span class="l">tracked</span></div>' +
    '</div>';

  return rows + tally + (editable ? addRow() : '');
}

function healthBlock(k, editable){
  const own = S.days[k] && S.days[k].sick;
  const eff = sickOn(k);
  const status = own ? own.status : (eff ? eff.status : null);
  const carried = !!eff && !own;

  let html = '<div class="seg">' +
    '<button class="' + (status === 'fine' ? 'on-fine' : '') + '" ' +
      (editable ? 'data-act="sick" data-v="fine" data-k="' + k + '"' : 'disabled') + '>Fine</button>' +
    '<button class="' + (status === 'sick' ? 'on-sick' : '') + '" ' +
      (editable ? 'data-act="sick" data-v="sick" data-k="' + k + '"' : 'disabled') + '>Sick' +
      (carried ? '<span class="carry">carried over</span>' : '') + '</button>' +
    '</div>';

  if (status === 'sick'){
    const ill = (own && own.illness) || (eff && eff.illness) || null;
    const note = (own && own.note) || (eff && eff.note) || '';
    const custom = ill && ILLNESSES.indexOf(ill) === -1;

    html += '<div class="sickbox"><h3>What is it?</h3><div class="chips">' +
      ILLNESSES.map(n => '<button class="chip ' + (ill === n ? 'on' : '') + '" ' +
        (editable ? 'data-act="ill" data-v="' + esc(n) + '" data-k="' + k + '"' : 'disabled') + '>' + n + '</button>').join('') +
      '<button class="chip ' + (custom ? 'on' : '') + '" ' +
        (editable ? 'data-act="illother" data-k="' + k + '"' : 'disabled') + '>' +
        (custom ? esc(ill) : 'Something else') + '</button>' +
      '</div>';

    html += '<h3>Notes while you are ill</h3>' +
      '<textarea class="sick-note" placeholder="Symptoms, medicine, how you slept…" ' +
        (editable ? 'data-act="sicknote" data-k="' + k + '"' : 'readonly') + '>' + esc(note) + '</textarea>';

    const start = eff ? eff.startedOn : k;
    const n = span(start, k) + 1;
    if (n >= CONFIG.SICK_NUDGE_AFTER){
      html += '<div class="day-of">' + ICON.info +
        '<span>Day ' + n + ' of ' + esc(ill || 'this') + '. Mark yourself Fine on the day it ends.</span></div>';
    } else if (carried){
      html += '<div class="day-of">' + ICON.info +
        '<span>Day ' + n + ', carried over from ' + esc(pretty(start)) +
        '. It stops as soon as you mark a day Fine.</span></div>';
    }
    html += '</div>';
  }
  return html;
}

function pageCal(){
  const c = S.month, y = c.getFullYear(), m = c.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const len = new Date(y, m+1, 0).getDate();
  const prevLen = new Date(y, m, 0).getDate();
  const tk = today();

  let cells = '';
  for (let i = 0; i < 42; i++){
    let num, off;
    if (i < lead){ num = prevLen - lead + 1 + i; off = -1; }
    else if (i >= lead + len){ num = i - lead - len + 1; off = 1; }
    else { num = i - lead + 1; off = 0; }

    const dt = new Date(y, m + off, num), k = key(dt);
    const e = S.days[k], sk = sickOn(k);
    const mo = e && e.mood ? mood(e.mood) : null;

    const pips = liveHabits(k).slice(0,8).map(h => {
      const st = habitOn(h, k);
      return '<i class="' + (st.done ? 'd' : st.missed ? 'm' : '') + '"></i>';
    }).join('');

    const hz = sk
      ? (sk.status === 'sick'
          ? '<div class="hz s">SICK</div>'
          : '<div class="hz f">FINE</div>')
      : '';

    cells += '<button class="cell ' + (off ? 'out ' : '') + (k === tk ? 'now' : '') + '" ' +
      'data-act="open" data-k="' + k + '">' +
      '<span class="d fig">' + num + '</span>' +
      (mo ? '<span class="em">' + mo.em + '</span>' : '') + hz +
      '<span class="pips">' + pips + '</span>' +
      (e && e.event && e.event.trim() ? '<span class="nt"></span>' : '') +
      '</button>';
  }

  return '<div class="cal-bar"><h2>' + MONTH[m] + ' <i class="fig">' + y + '</i></h2>' +
    '<div class="stepper">' +
      '<button data-act="mon" data-d="-1" aria-label="Previous month">' + ICON.prev + '</button>' +
      '<button class="btn btn-quiet btn-sm" data-act="mon" data-d="0">Today</button>' +
      '<button data-act="mon" data-d="1" aria-label="Next month">' + ICON.next + '</button>' +
    '</div></div>' +
    '<div class="dow-row">' + DOW_MINI.map(d => '<span>' + d + '</span>').join('') + '</div>' +
    '<div class="cal">' + cells + '</div>';
}

function summaryView(){
  const c = S.month, y = c.getFullYear(), m = c.getMonth();
  const len = new Date(y, m+1, 0).getDate();

  const counts = { terrible:0, okay:0, alright:0, good:0, happy:0 };
  let logged = 0, sickDays = 0, written = 0;
  for (let i = 1; i <= len; i++){
    const k = key(new Date(y, m, i)), e = S.days[k];
    if (e && e.mood){ counts[e.mood]++; logged++; }
    const sk = sickOn(k); if (sk && sk.status === 'sick') sickDays++;
    if (e && e.event && e.event.trim()) written++;
  }
  const bar = MOODS.map(mm => {
    const p = logged ? counts[mm.id] / logged * 100 : 0;
    return p ? '<div style="width:' + p + '%;background:' + mm.c + '"></div>' : '';
  }).join('');
  const top = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
  const topLabel = logged && counts[top] ? mood(top).label : '—';

  const rows = Object.keys(S.habits).map(id => S.habits[id])
    .filter(h => !h.deletedAt)
    .map(h => {
      const f = freq(h.frequency);
      let expect = 0, got = 0;
      for (let i = 1; i <= len; i++){
        const k = key(new Date(y, m, i));
        if (k < h.createdAt) continue;
        if (f.n !== null && span(h.createdAt, k) % f.n === 0) expect++;
        const e = S.days[k];
        if (e && e.habits && e.habits[h.id] && e.habits[h.id].done) got++;
      }
      const pct = expect ? Math.round(got / expect * 100) : (f.n === null ? null : 0);
      return { h, f, got, expect, pct };
    })
    .sort((a,b) => (b.pct === null ? -1 : b.pct) - (a.pct === null ? -1 : a.pct));

  const habitRows = rows.length
    ? rows.map(r =>
        '<div class="hrow"><div><div class="nm">' + esc(r.h.name) + '</div>' +
        '<div class="fq">' + r.f.label + (r.expect ? ' — ' + r.got + ' of ' + r.expect : '') + '</div></div>' +
        '<div class="pct fig">' + (r.pct === null ? r.got : r.pct + '%') + '</div>' +
        '<div class="track"><i style="width:' + (r.pct === null ? 0 : r.pct) + '%"></i></div></div>').join('')
    : '<div class="empty"><h3>Nothing to measure yet</h3><p>Habit rates appear once you have some.</p></div>';

  return '<div class="cal-bar"><h2>' + MONTH[m] + ' <i class="fig">' + y + '</i></h2>' +
      '<div class="stepper">' +
        '<button data-act="mon" data-d="-1" aria-label="Previous month">' + ICON.prev + '</button>' +
        '<button class="btn btn-quiet btn-sm" data-act="mon" data-d="0">Today</button>' +
        '<button data-act="mon" data-d="1" aria-label="Next month">' + ICON.next + '</button>' +
      '</div></div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="l">Days logged</div><div class="v">' + logged +
        '<small> / ' + len + '</small></div><div class="s">' + written + ' with a note</div></div>' +
      '<div class="stat"><div class="l">Most common mood</div><div class="v" style="font-size:21px">' +
        topLabel + '</div><div class="mbar">' + bar + '</div></div>' +
      '<div class="stat"><div class="l">Sick days</div><div class="v">' + sickDays + '</div>' +
        '<div class="s">' + (sickDays ? Math.round(sickDays / len * 100) + '% of the month' : 'none') + '</div></div>' +
      '<div class="stat"><div class="l">Habits tracked</div><div class="v">' +
        rows.length + '</div><div class="s">' + rows.filter(r => r.pct >= 80).length + ' at 80% or better</div></div>' +
    '</div>' +
    '<h2 style="font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 6px">Habit completion</h2>' +
    habitRows;
}

/* ══════════════════════════════════════════════
   DAY SHEET  (look back / re-edit)
   ══════════════════════════════════════════════ */
function openSheet(k){ S.sheetDate = k; $('#daySheet').classList.add('show'); drawSheet(); }
function closeSheet(){ S.sheetDate = null; $('#daySheet').classList.remove('show'); draw(); }

function drawSheet(){
  const k = S.sheetDate; if (!k) return;
  const d = fromKey(k);
  const open = canEdit(k);
  const isToday = k === today();

  const gate = isToday
    ? ''
    : (open
        ? '<div class="gate open"><p>Editing is open for this day. Everything you change saves right away.</p>' +
          '<button class="btn btn-sm" data-act="relock" data-k="' + k + '">Close editing</button></div>'
        : '<div class="gate">' +
          '<p>This day is read only so you cannot change it by accident.</p>' +
          '<button class="btn btn-sm btn-lamp" data-act="askedit" data-k="' + k + '">' +
            ICON.pencil + ' Edit</button></div>');

  $('#daySheet').innerHTML =
    '<div class="sheet"><div class="sheet-top"><div class="t">' +
      '<b>' + DOW_LONG[d.getDay()] + '</b>' +
      '<i>' + d.getDate() + ' ' + MONTH[d.getMonth()] + ' ' + d.getFullYear() +
        (isToday ? ' — today' : '') + '</i>' +
    '</div><button class="x" data-act="closesheet" aria-label="Close">' + ICON.close + '</button></div>' +
    '<div class="sheet-body">' + gate +
      '<div class="sect"><h2>Habits</h2>' + habitsBlock(k, open) + '</div>' +
      '<div class="sect"><h2>Mood</h2>' + moodBlock(k, open) + '</div>' +
      '<div class="sect"><h2>Body</h2>' + healthBlock(k, open) + '</div>' +
      '<div class="sect"><h2>Event</h2>' + eventBlock(k, open) + '</div>' +
      '<div class="sheet-nav">' +
        '<button class="btn btn-quiet" data-act="sday" data-d="-1">' + ICON.prev + ' Previous</button>' +
        '<button class="btn btn-quiet" data-act="sday" data-d="1">Next ' + ICON.next + '</button>' +
      '</div>' +
    '</div></div>';
}

/* ══════════════════════════════════════════════
   ASK DIALOG  (the double confirmation)
   ══════════════════════════════════════════════ */
let askPending = null;
function ask(o){
  askPending = o;
  $('#askBox').innerHTML =
    '<div class="ask"><h3>' + esc(o.title) + '</h3><p>' + esc(o.body) + '</p>' +
    '<div class="row">' +
      '<button class="btn" data-act="askno">' + esc(o.no || 'No') + '</button>' +
      '<button class="btn ' + (o.danger ? '' : 'btn-lamp') + '" data-act="askyes" ' +
        (o.danger ? 'style="background:var(--miss);border-color:var(--miss);color:#fff;font-weight:600"' : '') + '>' +
        esc(o.yes || 'Yes') + '</button>' +
    '</div></div>';
  $('#askBox').classList.add('show');
}
function closeAsk(){ $('#askBox').classList.remove('show'); askPending = null; }

/* ══════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════ */
function draw(){
  drawHeader(); drawNav();
  const m = $('#main');
  if (S.page === 'habits')      m.innerHTML = pageHabits();
  else if (S.page === 'event')  m.innerHTML = pageEvent();
  else if (S.page === 'health') m.innerHTML = pageHealth();
  else if (S.page === 'cal')    m.innerHTML = pageCal();
  else                          m.innerHTML = pageYear();
}

/* ══════════════════════════════════════════════
   EVENTS  (delegated — survives re-render)
   ══════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const menu = $('#menu');
  if (!e.target.closest('#menu') && !e.target.closest('#dotsBtn')) menu.classList.remove('show');

  if (e.target.closest('#dotsBtn')){ menu.classList.toggle('show'); return; }
  if (e.target === $('#daySheet')){ closeSheet(); return; }
  if (e.target === $('#askBox')){ closeAsk(); return; }

  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, k = t.dataset.k;

  switch (a){
    case 'page':
      S.page = t.dataset.page; draw(); $('#main').scrollTop = 0; break;

    case 'tick': {
      const hid = t.dataset.h;
      const on = !!(S.days[k] && S.days[k].habits && S.days[k].habits[hid] && S.days[k].habits[hid].done);
      tickHabit(k, hid, !on);
      if (S.sheetDate) drawSheet(); else draw();
      break;
    }
    case 'hmenu': {
      const h = S.habits[t.dataset.h];
      if (!h) break;
      habitOptions(h);
      break;
    }
    case 'mood': {
      const id = t.dataset.m;
      const cur = S.days[k] && S.days[k].mood;
      putMood(k, cur === id ? null : id);
      if (S.sheetDate) drawSheet(); else draw();
      break;
    }
    case 'sick': {
      const v = t.dataset.v;
      const cur = (S.days[k] && S.days[k].sick) || sickOn(k) || {};
      if (v === 'fine'){
        const already = S.days[k] && S.days[k].sick && S.days[k].sick.status === 'fine';
        putSick(k, already ? null : { status:'fine', illness:null, note:'' });
      } else {
        const already = S.days[k] && S.days[k].sick && S.days[k].sick.status === 'sick';
        putSick(k, already ? null
          : { status:'sick', illness: cur.illness || null, note: cur.note || '' });
      }
      if (S.sheetDate) drawSheet(); else draw();
      break;
    }
    case 'ill': {
      const cur = (S.days[k] && S.days[k].sick) || sickOn(k) || { note:'' };
      const same = cur.illness === t.dataset.v;
      putSick(k, { status:'sick', illness: same ? null : t.dataset.v, note: cur.note || '' });
      if (S.sheetDate) drawSheet(); else draw();
      break;
    }
    case 'illother': {
      const cur = (S.days[k] && S.days[k].sick) || sickOn(k) || { note:'' };
      const seed = cur.illness && ILLNESSES.indexOf(cur.illness) === -1 ? cur.illness : '';
      const name = window.prompt('What is it called?', seed);
      if (name && name.trim()){
        putSick(k, { status:'sick', illness: name.trim().slice(0,40), note: cur.note || '' });
        if (S.sheetDate) drawSheet(); else draw();
      }
      break;
    }

    case 'open':
      openSheet(k); break;
    case 'closesheet':
      closeSheet(); break;
    case 'askedit':
      askEdit(k); break;
    case 'relock':
      S.unlocked.delete(k); drawSheet(); break;
    case 'sday': {
      S.sheetDate = key(shift(fromKey(S.sheetDate), Number(t.dataset.d)));
      drawSheet();
      $('.sheet-body').scrollTop = 0;
      break;
    }

    case 'mon': {
      const d = Number(t.dataset.d);
      S.month = d === 0 ? new Date() : new Date(S.month.getFullYear(), S.month.getMonth() + d, 1);
      draw(); break;
    }
    case 'yr':
      S.year += Number(t.dataset.d); draw(); break;
    case 'ytab':
      S.yearTab = t.dataset.v; draw(); break;

    case 'askyes': {
      const p = askPending; closeAsk();
      if (p && p.onYes) p.onYes();
      break;
    }
    case 'askno':
      closeAsk(); break;

    case 'signin': {
      menu.classList.remove('show');
      kvGet('authHint').then(h => kvGet('everSignedIn').then(ev => {
        S.client.requestAccessToken({ prompt: ev ? '' : 'consent', hint: h || undefined });
      }));
      break;
    }
    case 'signout':
      menu.classList.remove('show');
      if (S.token) google.accounts.oauth2.revoke(S.token, () => {});
      S.token = null; S.signedIn = false; S.email = null;
      kvPut('authHint', null); kvPut('everSignedIn', false);
      drawMenu(); setSync('','Local only');
      break;
    case 'syncnow':
      menu.classList.remove('show'); syncNow(); break;
    case 'export': {
      menu.classList.remove('show');
      const b = new Blob([JSON.stringify(payload(), null, 2)], { type:'application/json' });
      const u = URL.createObjectURL(b);
      const link = document.createElement('a');
      link.href = u; link.download = 'journal-' + today() + '.json';
      link.click(); URL.revokeObjectURL(u);
      break;
    }
    case 'import':
      menu.classList.remove('show'); $('#file').click(); break;
  }
});

function habitOptions(h){
  const f = freq(h.frequency);
  askPending = null;
  $('#askBox').innerHTML =
    '<div class="ask"><h3>' + esc(h.name) + '</h3>' +
    '<p>How often do you want to do this?</p>' +
    '<select id="optFq" style="margin-bottom:16px">' +
      FREQS.map(x => '<option value="' + x.id + '"' + (x.id === f.id ? ' selected' : '') + '>' + x.label + '</option>').join('') +
    '</select>' +
    '<div class="row">' +
      '<button class="btn" data-act="askno">Cancel</button>' +
      '<button class="btn btn-lamp" id="optSave">Save</button>' +
    '</div>' +
    '<button class="btn btn-quiet" id="optDel" style="width:100%;margin-top:9px;color:var(--miss)">Delete habit</button>' +
    '</div>';
  $('#askBox').classList.add('show');

  $('#optSave').onclick = () => {
    editHabit(h.id, { frequency: $('#optFq').value });
    closeAsk();
    if (S.sheetDate) drawSheet(); else draw();
  };
  $('#optDel').onclick = () => {
    closeAsk();
    ask({
      title:'Delete this habit?',
      body:'"' + h.name + '" disappears from today onward. Days you already ticked keep their record.',
      yes:'Yes, delete', no:'No, keep it', danger:true,
      onYes(){ dropHabit(h.id); if (S.sheetDate) drawSheet(); else draw(); }
    });
  };
}

/* text inputs: save silently, never re-render (keeps the caret) */
document.addEventListener('input', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, k = t.dataset.k;
  if (a === 'event'){
    putEvent(k, t.value);
    const foot = t.parentElement.querySelector('.note-foot span');
    if (foot){
      const w = t.value.trim() ? t.value.trim().split(/\s+/).length : 0;
      foot.textContent = w ? w + (w === 1 ? ' word' : ' words') : 'Nothing written yet';
    }
  } else if (a === 'sicknote'){
    const cur = (S.days[k] && S.days[k].sick) || sickOn(k) || {};
    putSick(k, { status:'sick', illness: cur.illness || null, note: t.value });
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-act="addhabit"]');
  if (!f) return;
  e.preventDefault();
  const nm = f.querySelector('[name=nm]').value.trim();
  if (!nm) return;
  const sel = f.querySelector('[name=fq]');
  addHabit(nm, sel ? sel.value : 'daily');
  if (S.sheetDate) drawSheet(); else draw();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#askBox').classList.contains('show')) closeAsk();
  else if (S.sheetDate) closeSheet();
});

$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    ask({
      title:'Merge this file in?',
      body:'Entries that are newer than what you have will replace them. Nothing else is touched.',
      yes:'Yes, merge', no:'No, cancel',
      async onYes(){
        if (merge(data)){
          await saveLocal();
          S.dirty = true;
          if (S.signedIn) syncNow();
          draw();
          toast('Merged', 'good');
        } else toast('Nothing newer to merge');
      }
    });
  } catch(err){ toast('That file could not be read', 'bad'); }
  e.target.value = '';
};

/* ══════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════ */
(async function boot(){
  await loadLocal();
  bump();
  draw();
  drawMenu();
  setSync('','Local only');

  try { await initAuth(); }
  catch(_){ toast('Google sign-in unavailable. Working offline.', 'bad'); }

  window.addEventListener('focus', () => { if (S.signedIn) syncNow(); });
  window.addEventListener('online', () => { if (S.signedIn) syncNow(); });
  setInterval(() => {
    if (S.signedIn && document.visibilityState === 'visible') syncNow();
  }, CONFIG.POLL);

  // roll the header over at midnight
  setInterval(() => {
    if (S.page !== 'cal' && S.page !== 'year'){
      const shown = $('#headDate').querySelector('.md');
      const want = new Date().getDate() + ' ' + MONTH[new Date().getMonth()];
      if (shown && shown.textContent !== want) draw();
    }
  }, 60000);

  window.addEventListener('beforeunload', () => {
    if (S.dirty && S.signedIn && S.fileId && navigator.sendBeacon){
      try {
        navigator.sendBeacon(
          'https://www.googleapis.com/upload/drive/v3/files/' + S.fileId +
          '?uploadType=media&access_token=' + encodeURIComponent(S.token || ''),
          new Blob([JSON.stringify(payload())], { type:'application/json' }));
      } catch(_){}
    }
  });
})();
</script>
